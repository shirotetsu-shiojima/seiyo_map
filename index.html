<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>道路マップビューア</title>
<style>
  :root {
    --bg: #eef1f4; --panel: #ffffff; --ink: #1f2933; --muted: #7b8794; --line: #d9e0e7;
    --hw: #e8590c; --road: #3e4c59; --accent: #1c7ed6; --danger: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151a20; --panel: #1f262e; --ink: #e4e9ee; --muted: #8a96a3; --line: #323c47;
      --road: #9aa8b6; --accent: #74c0fc; --danger: #ff8787;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151a20; --panel: #1f262e; --ink: #e4e9ee; --muted: #8a96a3; --line: #323c47;
    --road: #9aa8b6; --accent: #74c0fc; --danger: #ff8787;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,.10); padding: 12px 14px; font-size: 13px; max-width: calc(100vw - 24px); }
  #top { top: 12px; left: 12px; width: 300px; max-height: calc(100vh - 24px); overflow-y: auto; }
  #legend { bottom: 12px; left: 12px; }
  #info { top: 12px; right: 12px; width: 300px; display: none; }
  #coord { bottom: 12px; right: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding: 6px 10px; }
  #coord:empty { display: none; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 12px 0 6px; letter-spacing: .04em; }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; flex-wrap: wrap; }
  .btn { display: inline-block; border: 1px solid var(--accent); color: var(--accent); background: transparent;
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  .btn:hover { background: var(--accent); color: #fff; }
  input[type="file"] { display: none; }
  .meta { color: var(--muted); line-height: 1.6; }
  .error { color: var(--danger); margin-top: 8px; min-height: 1.2em; }
  label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .swatch { display: inline-block; width: 56px; border-radius: 3px; flex: none; }
  .lanes-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .lanes-row span { width: 58px; color: var(--muted); }
  dl { display: grid; grid-template-columns: 84px 1fr; gap: 4px 10px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-all; }
  #info .close { float: right; border: none; background: none; color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1; }
  #drop { position: fixed; inset: 0; background: rgba(28,126,214,.12); border: 3px dashed var(--accent);
    display: none; align-items: center; justify-content: center; font-size: 20px; color: var(--accent); pointer-events: none; }
  #empty { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #empty > div { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 26px; text-align: center; line-height: 1.8; }
  @media (max-width: 640px) {
    #top { width: auto; right: 12px; }
    #info { top: auto; bottom: 56px; left: 12px; right: 12px; width: auto; }
    #legend { display: none; }
  }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="drop">JSONまたは地図画像をドロップして読み込む</div>
<div id="empty"><div>
  <div style="font-size:17px;font-weight:600">道路マップビューア</div>
  <div class="meta">「/carroad export」で書き出したJSONを読み込んでください</div>
  <div class="meta">背景の地図は、このHTMLと同じフォルダの images の中から自動で読み込みます</div>
  <div style="margin-top:12px"><label class="btn" for="file">JSONを開く</label></div>
  <div class="meta" style="margin-top:8px;font-size:12px">ファイルは、このPCの中だけで読み込まれます</div>
</div></div>

<div id="top" class="panel">
  <h1>道路マップ</h1>
  <div class="row">
    <label class="btn" for="file">JSONを開く</label>
    <span id="fileName" class="meta" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
  </div>
  <input id="file" type="file" accept=".json,application/json">
  <div id="summary" class="meta" style="margin-top:8px"></div>

  <h2>背景の地図(地図画像 9 枚)</h2>
  <div class="row">
    <label class="btn" for="bgDir">地図フォルダを開く</label>
    <label class="btn" for="bgFiles">画像を選ぶ</label>
  </div>
  <input id="bgDir" type="file" webkitdirectory multiple>
  <input id="bgFiles" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" multiple>
  <div id="bgStatus" class="meta" style="margin-top:6px">背景の地図を読み込んでいます…</div>
  <label style="margin-top:6px"><input type="checkbox" id="bgShow" checked> 背景の地図を表示</label>
  <div class="row"><span class="meta" style="width:40px">濃さ</span>
    <input id="bgAlpha" type="range" min="10" max="100" value="85" style="flex:1"></div>
  <div class="row"><button class="btn" id="bgClear" type="button">背景を消す</button></div>

  <h2>表示</h2>
  <label><input type="checkbox" id="showHighway" checked> 高速道路</label>
  <label><input type="checkbox" id="showOther" checked> 一般道路・生活道路</label>
  <label><input type="checkbox" id="showUnbuilt" checked> 未建設の道路も表示</label>
  <div id="error" class="error"></div>
</div>

<div id="legend" class="panel">
  <h2 style="margin-top:0">見た目</h2>
  <div class="row"><span class="swatch" style="height:6px;background:var(--hw)"></span> 高速道路</div>
  <div class="row"><span class="swatch" style="height:6px;background:var(--road)"></span> 一般道路・生活道路</div>
  <div class="row"><span class="swatch" id="tunnelSwatch" style="height:6px"></span> トンネル(グレーを混ぜた色)</div>
  <h2>太さ(車線数)</h2>
  <div id="lanesLegend"></div>
  <div class="meta" style="margin-top:6px;font-size:12px">未建設の道路は半透明で描きます。北は上です。</div>
</div>

<div id="info" class="panel">
  <button class="close" id="closeInfo" aria-label="閉じる">×</button>
  <h1 id="infoTitle"></h1>
  <dl id="infoBody"></dl>
</div>

<div id="coord" class="panel"></div>

<script>
(() => {
  const TYPE_LABEL = { residential: '生活道路', general: '一般道路', highway: '高速道路' };
  const MODE_LABEL = { earthwork: '土工', bridge: '橋梁', tunnel: 'トンネル' };
  const HW_COLOR = '#e8590c';
  const OTHER_COLOR = getComputedStyle(document.documentElement).getPropertyValue('--road').trim() || '#3e4c59';
  const GRAY_HEX = '#8a939b';          // トンネルに混ぜるグレー
  const TUNNEL_TINT = 0.45;            // トンネルのグレーの割合
  const LANE_SAMPLES = [1, 2, 4, 6, 8];

  // ---- 地図画像の設定 ----
  // 地図は 3 × 3 に並ぶ。番号は左上から 1,2,3 / 4,5,6 / 7,8,9。ブロック5の中心が (0, 0)
  const MAP_COLS = 3, MAP_ROWS = 3;
  const TILE_W = 32768, TILE_H = 22528;          // 1枚が表すブロック数(= 元の画像の 8192×5632 px、1px = 4ブロック)
  const SRC_W = 8192, SRC_H = 5632;              // 元の画像の大きさ(px)
  const LEVELS = [512, 1024, 2048, 4096, 8192];  // 表示用に縮小して読む時の横幅(px)。小さく見る時は小さい方を読む
  const MAX_BYTES = 800 * 1024 * 1024;           // 同時に持つ地図の上限(概算。超えたら、画面外のものから手放す)
  const MAX_CONCURRENT = 2;                      // 同時に読み込む数
  const DEFAULT_DIR = 'images';                  // このHTMLと同じフォルダの中の地図画像を、最初に読む
  const MIN_SCALE = 0.002, MAX_SCALE = 40;

  const canvas = document.getElementById('map');
  const ctx = canvas.getContext('2d');
  const $ = (id) => document.getElementById(id);

  const view = { cx: 0, cz: 0, scale: 4 };
  let roads = [];
  let selected = null;
  let hover = null;
  let needsDraw = true;
  let fileName = '';
  let frameNo = 0;
  let tileGen = 0;
  // 地図画像: 番号 -> { n, origin:{x,z}, src, bitmap(canvas), level, loading, failed, lastSeen, gen }
  let tiles = new Map();
  let sourceLabel = '';
  let blobUrls = [];
  const jobs = [];
  let activeJobs = 0;

  // 車線数で太さを変える(画面のピクセル。ズームしても同じ太さ)
  const lanePx = (lanes) => 2 + Math.max(1, lanes || 1) * 1.6;
  const visible = (r) => (r.highway ? $('showHighway').checked : $('showOther').checked)
    && (r.built || $('showUnbuilt').checked);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const dpr = () => window.devicePixelRatio || 1;

  // 2つの色を混ぜる(t=0 で a、t=1 で b)
  function mixHex(a, b, t) {
    const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
    const pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
    return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }
  // 道路の色。トンネルは、グレーを混ぜて見分けやすくする
  function colorOf(r) {
    const base = r.highway ? HW_COLOR : OTHER_COLOR;
    return r.mode === 'tunnel' ? mixHex(base, GRAY_HEX, TUNNEL_TINT) : base;
  }

  function resize() {
    canvas.width = Math.round(innerWidth * dpr());
    canvas.height = Math.round(innerHeight * dpr());
    ctx.setTransform(dpr(), 0, 0, dpr(), 0, 0);
    needsDraw = true;
  }
  const toScreen = (x, z) => [(x - view.cx) * view.scale + innerWidth / 2, (z - view.cz) * view.scale + innerHeight / 2];
  const toWorld = (sx, sy) => [(sx - innerWidth / 2) / view.scale + view.cx, (sy - innerHeight / 2) / view.scale + view.cz];

  function normalize(raw) {
    const levels = Array.isArray(raw.level_y_by_step) ? raw.level_y_by_step : [];
    let yMin = null, yMax = null;
    for (const y of levels) {
      if (yMin === null || y < yMin) yMin = y;
      if (yMax === null || y > yMax) yMax = y;
    }
    return {
      id: raw.id, type: raw.type, highway: raw.type === 'highway', lanes: raw.lanes, mode: raw.mode,
      built: !!raw.built, length: raw.length, sidewalk: raw.sidewalk_width,
      from: raw.from, to: raw.to, dimension: raw.dimension, surface: raw.lane_surface,
      yMin, yMax,
      pts: raw.centerline.map((p) => [p.x, p.z]),
    };
  }

  function showError(msg) { $('error').textContent = msg; }

  function loadText(text, name) {
    let data;
    try { data = JSON.parse(text); }
    catch (e) { showError('JSONとして読めませんでした。'); return; }
    if (!data || data.format !== 'car_input.roads' || !Array.isArray(data.roads)) {
      showError('道路のエクスポートファイルではありません(car_input.roads)。');
      return;
    }
    showError('');
    roads = data.roads
      .filter((r) => Array.isArray(r.centerline) && r.centerline.length >= 2)
      .map(normalize);
    fileName = name;
    selected = null;
    showInfo(null);
    updateSummary(data);
    fitView();
    $('empty').style.display = 'none';
    needsDraw = true;
  }

  function updateSummary(data) {
    const hw = roads.filter((r) => r.highway).length;
    const total = roads.reduce((sum, r) => sum + (r.length || 0), 0);
    const dims = [...new Set(roads.map((r) => r.dimension))];
    $('fileName').textContent = fileName;
    $('summary').textContent =
      `道路 ${roads.length} 本(高速道路 ${hw} 本)・合計 ${total} ブロック` +
      (dims.length ? `・${dims.join(', ')}` : '') +
      (data.exported_at ? `・書き出し ${new Date(data.exported_at).toLocaleString('ja-JP')}` : '');
  }

  // 道路があれば道路に合わせ、道路がなければ読み込んだ地図に合わせる
  function fitView() {
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    const grow = (x0, z0, x1, z1) => {
      minX = Math.min(minX, x0); maxX = Math.max(maxX, x1);
      minZ = Math.min(minZ, z0); maxZ = Math.max(maxZ, z1);
    };
    for (const r of roads) for (const [x, z] of r.pts) grow(x, z, x, z);
    if (!roads.length) {
      for (const t of tiles.values()) grow(t.origin.x, t.origin.z, t.origin.x + TILE_W, t.origin.z + TILE_H);
    }
    if (!Number.isFinite(minX)) { view.cx = 0; view.cz = 0; view.scale = 4; return; }
    const w = Math.max(maxX - minX, 20), h = Math.max(maxZ - minZ, 20);
    view.scale = clamp(Math.min((innerWidth * 0.8) / w, (innerHeight * 0.8) / h), MIN_SCALE, MAX_SCALE);
    view.cx = (minX + maxX) / 2;
    view.cz = (minZ + maxZ) / 2;
  }

  function niceStep(raw) {
    const steps = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000];
    return steps.find((s) => s >= raw) || 200000;
  }

  function drawGrid() {
    const step = niceStep(90 / view.scale);
    const [x0, z0] = toWorld(0, 0);
    const [x1, z1] = toWorld(innerWidth, innerHeight);
    ctx.save();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(128,140,150,0.22)';
    ctx.fillStyle = 'rgba(128,140,150,0.9)';
    ctx.font = '11px system-ui, sans-serif';
    for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) {
      const [sx] = toScreen(x, 0);
      ctx.beginPath(); ctx.moveTo(Math.round(sx) + 0.5, 0); ctx.lineTo(Math.round(sx) + 0.5, innerHeight); ctx.stroke();
      ctx.fillText(String(x), sx + 3, innerHeight - 6);
    }
    for (let z = Math.ceil(z0 / step) * step; z <= z1; z += step) {
      const [, sy] = toScreen(0, z);
      ctx.beginPath(); ctx.moveTo(0, Math.round(sy) + 0.5); ctx.lineTo(innerWidth, Math.round(sy) + 0.5); ctx.stroke();
      ctx.fillText(String(z), 4, sy - 3);
    }
    // 原点
    const [ox, oz] = toScreen(0, 0);
    ctx.strokeStyle = 'rgba(92,124,250,0.45)';
    ctx.beginPath(); ctx.moveTo(ox - 8, oz); ctx.lineTo(ox + 8, oz); ctx.moveTo(ox, oz - 8); ctx.lineTo(ox, oz + 8); ctx.stroke();
    ctx.restore();
  }

  function strokeLine(pts, width, color, alpha, dash) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    pts.forEach(([x, z], i) => {
      const [sx, sy] = toScreen(x, z);
      if (i) ctx.lineTo(sx, sy); else ctx.moveTo(sx, sy);
    });
    ctx.stroke();
    ctx.restore();
  }

  function drawRoads() {
    const list = roads.filter(visible);
    // 一般道路を先に描き、高速道路を上に重ねる。外枠線は付けない(継ぎ目を見やすくするため)
    const ordered = [...list.filter((r) => !r.highway), ...list.filter((r) => r.highway)];
    for (const r of ordered) {
      const w = lanePx(r.lanes);
      const alpha = r.built ? 1 : 0.45;
      strokeLine(r.pts, w, colorOf(r), alpha);
      if (r.highway && r.lanes >= 2) {
        strokeLine(r.pts, Math.max(1, w * 0.12), '#ffffff', alpha * 0.9, [6, 6]);
      }
    }
    if (selected && visible(selected)) {
      strokeLine(selected.pts, lanePx(selected.lanes) + 9, '#1c7ed6', 0.55);
    }
    if (hover && hover !== selected && visible(hover)) {
      strokeLine(hover.pts, lanePx(hover.lanes) + 6, '#1c7ed6', 0.25);
    }
  }

  // ---- 地図画像(map_small1.jpg 〜 map_small9.jpg) ----

  // 番号 n の画像の左上の座標。ブロック5(中央)の中心が (0, 0)
  function tileOrigin(n) {
    const col = (n - 1) % MAP_COLS;
    const row = Math.floor((n - 1) / MAP_COLS);
    return {
      x: (col - (MAP_COLS - 1) / 2) * TILE_W - TILE_W / 2,
      z: (row - (MAP_ROWS - 1) / 2) * TILE_H - TILE_H / 2,
    };
  }

  function parseMapName(name) {
    const m = /^map_small(\d+)\.(jpe?g|png)$/i.exec(name);
    if (!m) return null;
    const n = Number(m[1]);
    return n >= 1 && n <= MAP_COLS * MAP_ROWS ? n : null;
  }

  function makeTile(n, src, bitmap, level) {
    return { n, origin: tileOrigin(n), src, bitmap, level, loading: false, failed: false, lastSeen: -1, gen: tileGen };
  }

  // 画面に必要な横幅に合う、読み込みサイズ(縮小して読むと、メモリと時間が減る)
  function neededLevel() {
    const want = TILE_W * view.scale * dpr();
    return LEVELS.find((L) => L >= want) || LEVELS[LEVELS.length - 1];
  }

  function releaseAll() {
    for (const t of tiles.values()) t.bitmap = null;
    for (const u of blobUrls) URL.revokeObjectURL(u);
    blobUrls = [];
    jobs.length = 0;
  }

  // 画像を、指定した横幅に縮めて小さいキャンバスに描く。ファイルは file:// でも読める
  function decodeTo(src, L) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          c.width = L;
          c.height = Math.round(L * SRC_H / SRC_W);
          const g = c.getContext('2d');
          g.imageSmoothingQuality = 'high';
          g.drawImage(img, 0, 0, c.width, c.height);
          img.src = '';
          resolve(c);
        } catch (e) { reject(e); }
      };
      img.onerror = () => reject(new Error('画像を読めません: ' + src));
      img.src = src;
    });
  }

  // 同梱フォルダ(images)の地図を、一番小さいサイズで先に読む。無い番号は空白のまま
  async function loadDefaultTiles() {
    releaseAll();
    const gen = ++tileGen;
    const found = new Map();
    for (let n = 1; n <= MAP_COLS * MAP_ROWS; n++) {
      if (gen !== tileGen) return; // 途中で別の画像を選ばれたら、この読み込みは止める
      const src = `${DEFAULT_DIR}/map_small${n}.jpg`;
      try {
        found.set(n, makeTile(n, src, await decodeTo(src, LEVELS[0]), LEVELS[0]));
      } catch (e) { /* 無い画像は空白のまま */ }
    }
    if (gen !== tileGen) return;
    if (!found.size) {
      $('bgStatus').textContent = `${DEFAULT_DIR} フォルダに地図画像(map_small1.jpg など)が見つかりません。「地図フォルダを開く」から選ぶこともできます。`;
      return;
    }
    tiles = found;
    sourceLabel = `${DEFAULT_DIR} フォルダ`;
    $('bgShow').checked = true;
    if (!roads.length) fitView();
    updateBgStatus();
    needsDraw = true;
  }

  function loadTileFiles(list) {
    const picked = new Map();
    let ignored = 0;
    for (const f of list) {
      const n = parseMapName(f.name);
      if (!n) { ignored++; continue; }
      if (!picked.has(n)) picked.set(n, f);
    }
    if (!picked.size) {
      $('bgStatus').textContent = '地図画像が見つかりませんでした。ファイル名は map_small1.jpg 〜 map_small9.jpg です。';
      return;
    }
    releaseAll();
    tileGen++;
    tiles = new Map();
    for (const [n, f] of picked) {
      const url = URL.createObjectURL(f);
      blobUrls.push(url);
      tiles.set(n, makeTile(n, url, null, 0));
    }
    sourceLabel = '選んだ画像';
    $('bgShow').checked = true;
    if (!roads.length) fitView();
    $('empty').style.display = 'none';
    updateBgStatus(ignored);
    needsDraw = true;
  }

  function updateBgStatus(ignored = 0) {
    if (!tiles.size) { $('bgStatus').textContent = '背景の地図はまだありません'; return; }
    const total = MAP_COLS * MAP_ROWS;
    const have = [...tiles.keys()].sort((a, b) => a - b);
    const missing = [];
    for (let n = 1; n <= total; n++) if (!tiles.has(n)) missing.push(n);
    const parts = [`地図 ${have.length}/${total} 枚(${sourceLabel}・番号: ${have.join(', ')})`];
    if (missing.length) parts.push(`未配置: ${missing.join(', ')}(その部分は空白で表示)`);
    if (ignored) parts.push(`名前が合わない ${ignored} 件は無視`);
    $('bgStatus').textContent = parts.join(' ・ ');
  }

  function clearTiles() {
    releaseAll();
    tileGen++;
    tiles = new Map();
    sourceLabel = '';
    updateBgStatus();
    needsDraw = true;
  }

  // 表示に必要なサイズより粗い・細か過ぎる時だけ、読み直す(ズーム中に何度も読まないため)
  function wantLoad(t, need) {
    if (t.loading || t.failed) return false;
    if (!t.bitmap) return true;
    return t.level < need || t.level > need * 4;
  }

  function pumpJobs() {
    while (activeJobs < MAX_CONCURRENT && jobs.length) {
      const job = jobs.shift();
      activeJobs++;
      job().finally(() => { activeJobs--; pumpJobs(); needsDraw = true; });
    }
  }

  function requestLoad(t, L) {
    t.loading = true;
    const gen = t.gen;
    jobs.push(() => decodeTo(t.src, L)
      .then((c) => {
        if (gen !== tileGen) return;   // 読んでいる間に画像を入れ替えた時は、捨てる
        t.bitmap = c;
        t.level = L;
      }, () => { if (gen === tileGen && !t.bitmap) t.failed = true; })
      .finally(() => { if (gen === tileGen) t.loading = false; }));
    pumpJobs();
  }

  // 同時に持つ地図が多くなったら、今の画面に映っていないものから手放す
  function trimBitmaps() {
    const list = [...tiles.values()].filter((t) => t.bitmap);
    const bytes = (t) => t.level * (t.level * SRC_H / SRC_W) * 4;
    let total = list.reduce((sum, t) => sum + bytes(t), 0);
    if (total <= MAX_BYTES) return;
    const idle = list.filter((t) => t.lastSeen !== frameNo).sort((a, b) => a.lastSeen - b.lastSeen);
    for (const t of idle) {
      if (total <= MAX_BYTES) break;
      total -= bytes(t);
      t.bitmap = null;
      t.level = 0;
    }
  }

  function drawMap() {
    if (!tiles.size || !$('bgShow').checked) return;
    frameNo++;
    const need = neededLevel();
    const [wx0, wz0] = toWorld(0, 0);
    const [wx1, wz1] = toWorld(innerWidth, innerHeight);
    ctx.save();
    ctx.globalAlpha = Number($('bgAlpha').value) / 100;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    for (const t of tiles.values()) {
      const { x, z } = t.origin;
      // 画面に映っていない画像は、読み込みも描画もしない
      if (x + TILE_W < wx0 || x > wx1 || z + TILE_H < wz0 || z > wz1) continue;
      t.lastSeen = frameNo;
      if (wantLoad(t, need)) requestLoad(t, need);
      if (!t.bitmap) continue;
      // 隣の画像との境目に隙間が出ないよう、端を整数の画素に揃える
      const [sx0, sy0] = toScreen(x, z);
      const [sx1, sy1] = toScreen(x + TILE_W, z + TILE_H);
      const dx = Math.round(sx0), dy = Math.round(sy0);
      ctx.drawImage(t.bitmap, dx, dy, Math.round(sx1) - dx, Math.round(sy1) - dy);
    }
    ctx.restore();
    trimBitmaps();
  }

  function draw() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    drawMap();
    drawGrid();
    if (roads.length) drawRoads();
  }

  function distToSeg(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    t = clamp(t, 0, 1);
    const cx = ax + t * dx - px, cy = ay + t * dy - py;
    return Math.hypot(cx, cy);
  }

  // 画面上の点に最も近い道路(線の太さの範囲内)
  // 描いた順(一般道路 → 高速道路)で見て、同じ距離なら後に描いた方(上に見える方)を選ぶ
  function pick(sx, sy) {
    let best = null, bestD = Infinity;
    const list = [...roads.filter((r) => !r.highway), ...roads.filter((r) => r.highway)];
    for (const r of list) {
      if (!visible(r)) continue;
      const tol = lanePx(r.lanes) / 2 + 6;
      const pts = r.pts;
      for (let i = 1; i < pts.length; i++) {
        const [ax, ay] = toScreen(pts[i - 1][0], pts[i - 1][1]);
        const [bx, by] = toScreen(pts[i][0], pts[i][1]);
        const d = distToSeg(sx, sy, ax, ay, bx, by);
        if (d <= tol && d <= bestD) { bestD = d; best = r; }
      }
    }
    return best;
  }

  function addRow(dl, label, value) {
    const dt = document.createElement('dt'); dt.textContent = label;
    const dd = document.createElement('dd'); dd.textContent = value;
    dl.append(dt, dd);
  }

  function showInfo(r) {
    const box = $('info');
    if (!r) { box.style.display = 'none'; return; }
    $('infoTitle').textContent = `${TYPE_LABEL[r.type] || r.type} #${r.id}`;
    const dl = $('infoBody');
    dl.textContent = '';
    addRow(dl, '作り方', MODE_LABEL[r.mode] || r.mode || '-');
    addRow(dl, '車線数', `${r.lanes} 車線`);
    addRow(dl, '長さ', `${r.length} ブロック`);
    addRow(dl, '歩道', r.sidewalk ? `両側 ${r.sidewalk} ブロック` : 'なし');
    addRow(dl, '舗装', r.surface || '-');
    addRow(dl, '状態', r.built ? '建設済み' : '未建設');
    addRow(dl, '始点', `${r.from.x}, ${r.from.y}, ${r.from.z}`);
    addRow(dl, '終点', `${r.to.x}, ${r.to.y}, ${r.to.z}`);
    if (r.yMin !== null) addRow(dl, '高さ', `${r.yMin} 〜 ${r.yMax}`);
    addRow(dl, 'ディメンション', r.dimension || '-');
    box.style.display = 'block';
  }

  function buildLanesLegend() {
    const box = $('lanesLegend');
    box.textContent = '';
    for (const n of LANE_SAMPLES) {
      const row = document.createElement('div');
      row.className = 'lanes-row';
      const label = document.createElement('span');
      label.textContent = `${n} 車線`;
      const bar = document.createElement('span');
      bar.className = 'swatch';
      bar.style.height = `${lanePx(n)}px`;
      bar.style.background = 'var(--road)';
      bar.style.width = '70px';
      bar.style.display = 'inline-block';
      row.append(label, bar);
      box.append(row);
    }
  }

  // 入力
  $('file').addEventListener('change', (e) => readFile(e.target.files[0]));
  function readFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => loadText(String(reader.result), file.name);
    reader.readAsText(file, 'utf-8');
  }
  ['bgDir', 'bgFiles'].forEach((id) => $(id).addEventListener('change', (e) => {
    const list = Array.from(e.target.files || []);
    e.target.value = ''; // 同じフォルダを選び直しても反応するように
    if (list.length) loadTileFiles(list);
  }));
  $('bgClear').addEventListener('click', clearTiles);
  ['bgShow', 'bgAlpha'].forEach((id) => $(id).addEventListener('input', () => { needsDraw = true; }));
  ['showHighway', 'showOther', 'showUnbuilt'].forEach((id) => $(id).addEventListener('change', () => {
    if (selected && !visible(selected)) { selected = null; showInfo(null); }
    needsDraw = true;
  }));
  $('closeInfo').addEventListener('click', () => { selected = null; showInfo(null); needsDraw = true; });

  let dragCount = 0;
  window.addEventListener('dragenter', (e) => { e.preventDefault(); dragCount++; $('drop').style.display = 'flex'; });
  window.addEventListener('dragleave', () => { dragCount = Math.max(0, dragCount - 1); if (!dragCount) $('drop').style.display = 'none'; });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    dragCount = 0;
    $('drop').style.display = 'none';
    const files = Array.from(e.dataTransfer.files);
    if (files.some((f) => parseMapName(f.name))) loadTileFiles(files);
    else if (files.length) readFile(files[0]);
  });

  // 地図の操作
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, y: e.clientY, cx: view.cx, cz: view.cz, moved: false };
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', (e) => {
    const [wx, wz] = toWorld(e.clientX, e.clientY);
    $('coord').textContent = `X ${Math.round(wx)}   Z ${Math.round(wz)}`;
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
      view.cx = drag.cx - dx / view.scale;
      view.cz = drag.cz - dy / view.scale;
      needsDraw = true;
      return;
    }
    const h = pick(e.clientX, e.clientY);
    if (h !== hover) {
      hover = h;
      canvas.style.cursor = h ? 'pointer' : '';
      needsDraw = true;
    }
  });
  canvas.addEventListener('pointerup', (e) => {
    if (drag && !drag.moved) {
      selected = pick(e.clientX, e.clientY);
      showInfo(selected);
      needsDraw = true;
    }
    drag = null;
    canvas.classList.remove('dragging');
  });
  canvas.addEventListener('pointerleave', () => { $('coord').textContent = ''; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const [wx, wz] = toWorld(e.clientX, e.clientY);
    view.scale = clamp(view.scale * Math.exp(-e.deltaY * 0.0015), MIN_SCALE, MAX_SCALE);
    const [nx, nz] = toWorld(e.clientX, e.clientY);
    view.cx += wx - nx;
    view.cz += wz - nz;
    needsDraw = true;
  }, { passive: false });
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { selected = null; showInfo(null); needsDraw = true; }
  });

  resize();
  buildLanesLegend();
  $('tunnelSwatch').style.background = colorOf({ highway: false, mode: 'tunnel' });
  function frame() {
    if (needsDraw) { draw(); needsDraw = false; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  loadDefaultTiles();
  // テストやデバッグ用に、読み込み関数を公開する
  window.roadMap = {
    loadText, loadTileFiles, pick, view,
    get roads() { return roads; },
    get tiles() {
      return [...tiles.values()].map((t) => ({
        n: t.n, level: t.level, loading: t.loading, failed: t.failed, hasBitmap: !!t.bitmap,
      }));
    },
  };
})();
</script>
</body>
</html>
