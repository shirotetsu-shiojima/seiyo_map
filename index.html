<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星陽マップ</title>
<style>
  :root {
    --map-bg: #f2efe9; --panel: rgba(255,255,255,.97); --ink: #202124; --muted: #5f6368;
    --line: #e0e3e6; --chip: #f1f3f4; --accent: #1a73e8; --danger: #d93025;
    --halo: #ffffff; --rail-casing: #ffffff;
    --shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 8px rgba(60,64,67,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --map-bg: #1b2028; --panel: rgba(32,33,36,.97); --ink: #e8eaed; --muted: #9aa0a6;
      --line: #3c4043; --chip: #3c4043; --accent: #8ab4f8; --danger: #f28b82;
      --halo: #1b2028; --rail-casing: #1b2028;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --map-bg: #1b2028; --panel: rgba(32,33,36,.97); --ink: #e8eaed; --muted: #9aa0a6;
    --line: #3c4043; --chip: #3c4043; --accent: #8ab4f8; --danger: #f28b82;
    --halo: #1b2028; --rail-casing: #1b2028;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--map-bg); color: var(--ink);
    font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", "Meiryo", sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  .panel { position: fixed; background: var(--panel); border-radius: 12px; box-shadow: var(--shadow);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 12px 14px; font-size: 13px;
    max-width: calc(100vw - 24px); }
  #top { top: 12px; left: 12px; width: 312px; max-height: calc(100vh - 24px - var(--legend-h, 0px) - 12px);
    display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  #top .head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--line); }
  #top .logo { flex: 1; font-size: 16px; font-weight: 700; letter-spacing: .02em; }
  #top .body { padding: 6px 16px 14px; overflow-y: auto; }
  #top.collapsed .body { display: none; }
  #top.collapsed { width: auto; }
  #legend { bottom: 12px; left: 12px; padding: 10px 14px; min-width: 220px; }
  #info { top: 12px; right: 12px; width: 320px; display: none; padding: 0; overflow: hidden; }
  #coord { bottom: 12px; right: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding: 6px 10px; font-size: 12px; }
  #coord:empty { display: none; }
  .info-bar { height: 6px; background: var(--accent); }
  #info .inner { padding: 12px 16px 14px; }
  h1 { font-size: 16px; margin: 0 0 10px; font-weight: 700; }
  h2 { font-size: 11px; color: var(--muted); font-weight: 600; margin: 14px 0 6px; letter-spacing: .06em; }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; flex-wrap: wrap; }
  .btn { display: inline-block; border: 1px solid var(--line); color: var(--accent); background: var(--panel);
    border-radius: 18px; padding: 6px 14px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 500; }
  .btn:hover { background: var(--chip); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
  .icon { border: none; background: transparent; color: var(--ink); font-size: 18px; width: 34px; height: 34px;
    border-radius: 50%; cursor: pointer; line-height: 1; }
  .icon:hover { background: var(--chip); }
  input[type="file"] { display: none; }
  input[type="checkbox"], input[type="range"] { accent-color: var(--accent); }
  .meta { color: var(--muted); line-height: 1.6; }
  .error { color: var(--danger); margin-top: 8px; min-height: 1.2em; }
  label { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; margin: 3px 0; }
  .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
  .sw { display: inline-block; width: 44px; border-radius: 4px; flex: none; }
  .lanes-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .lanes-row span.lbl { width: 58px; color: var(--muted); }
  dl { display: grid; grid-template-columns: 84px 1fr; gap: 6px 10px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-all; }
  #info .close { float: right; border: none; background: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; padding: 0 0 0 8px; }
  #info .close:hover { color: var(--ink); }

  /* 地図の操作ボタン */
  .controls { position: fixed; right: 12px; bottom: 56px; display: flex; flex-direction: column; border-radius: 10px;
    overflow: hidden; box-shadow: var(--shadow); background: var(--panel); }
  .ctl { width: 40px; height: 40px; border: 0; border-bottom: 1px solid var(--line); background: transparent;
    color: var(--ink); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .ctl:last-child { border-bottom: 0; }
  .ctl:hover { background: var(--chip); }
  .compass { width: 40px; height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: var(--ink); border-bottom: 1px solid var(--line); line-height: 1.05; }
  .compass .arrow { color: #ea4335; font-size: 12px; }

  /* 縮尺バー */
  #scaleBar { bottom: 12px; left: 50%; transform: translateX(-50%); padding: 6px 10px 4px; font-size: 11px;
    color: var(--ink); text-align: center; font-variant-numeric: tabular-nums; }
  #scaleLine { height: 6px; border: 2px solid var(--ink); border-top: 0; margin: 0 auto 3px; width: 100px; }
  #scaleText { white-space: nowrap; }

  #drop { position: fixed; inset: 0; background: rgba(26,115,232,.10); border: 3px dashed var(--accent);
    display: none; align-items: center; justify-content: center; font-size: 20px; color: var(--accent);
    pointer-events: none; z-index: 10; }
  @media (max-width: 640px) {
    #top { width: auto; right: 12px; }
    #info { top: auto; bottom: 56px; left: 12px; right: 12px; width: auto; }
    #legend { display: none; }
    .controls { bottom: 12px; }
  }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="drop">JSONまたは地図画像をドロップして読み込む</div>

<div id="top" class="panel">
  <div class="head">
    <span class="logo">星陽マップ</span>
    <button class="icon" id="toggleTop" type="button" aria-label="メニューを開閉">☰</button>
  </div>
  <div class="body">
    <div class="row">
      <label class="btn primary" for="file">JSONを開く</label>
      <span id="fileName" class="fname"></span>
    </div>
    <input id="file" type="file" accept=".json,application/json">
    <div id="summary" class="meta" style="margin-top:8px"></div>

    <h2>データ(HTMLと同じフォルダの自動読み込み)</h2>
    <div class="row">
      <label class="btn" for="dataDir">データフォルダから読む</label>
    </div>
    <input id="dataDir" type="file" webkitdirectory multiple>
    <div id="autoStatus" class="meta" style="margin-top:6px">rail.json・train.json・road.json を読み込んでいます…</div>

    <h2>背景の地図(地図画像 9 枚)</h2>
    <div class="row">
      <label class="btn" for="bgDir">地図フォルダ</label>
      <label class="btn" for="bgFiles">画像を選ぶ</label>
    </div>
    <input id="bgDir" type="file" webkitdirectory multiple>
    <input id="bgFiles" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" multiple>
    <div id="bgStatus" class="meta" style="margin-top:6px">背景の地図を読み込んでいます…</div>
    <label style="margin-top:6px"><input type="checkbox" id="bgShow" checked> 背景の地図を表示</label>
    <div class="row"><span class="meta" style="width:40px">濃さ</span>
      <input id="bgAlpha" type="range" min="10" max="100" value="60" style="flex:1"></div>
    <div class="row"><button class="btn" id="bgClear" type="button">背景を消す</button></div>

    <h2>表示</h2>
    <label><input type="checkbox" id="showHighway" checked> 高速道路</label>
    <label><input type="checkbox" id="showOther" checked> 国道・県道・一般道路・生活道路</label>
    <label><input type="checkbox" id="showUnbuilt" checked> 未建設の道路も表示</label>
    <label style="margin-top:6px"><input type="checkbox" id="showTrains"> 列車の位置を表示(ローカルAPI)</label>
    <input id="trainUrl" type="text" placeholder="APIのURL(空欄なら自動で探す)" style="margin-top:6px;width:100%;box-sizing:border-box">
    <div id="trainStatus" class="meta" style="margin-top:4px"></div>
    <div id="trainList" class="meta" style="font-size:12px"></div>
    <div id="error" class="error"></div>

    <h2>鉄道</h2>
    <div class="row">
      <label class="btn" for="railFile">鉄道JSON</label>
      <span id="railName" class="fname"></span>
    </div>
    <input id="railFile" type="file" accept=".json,application/json">
    <div id="railSummary" class="meta" style="margin-top:6px"></div>
    <label style="margin-top:6px"><input type="checkbox" id="showRail" checked> 鉄道を表示</label>
    <div class="row" style="margin-top:8px">
      <label class="btn" for="routeFile">系統JSON</label>
      <span id="routeName" class="fname"></span>
    </div>
    <input id="routeFile" type="file" accept=".json,application/json">
    <div id="routeSummary" class="meta" style="margin-top:6px"></div>
    <label style="margin-top:6px"><input type="checkbox" id="showRouteColor" checked> 系統の色で線路を塗る</label>
    <label style="margin-top:4px"><input type="checkbox" id="hideDup" checked> 同じ色で経路が似た系統は、停車駅が最も多い1本だけ表示</label>
  </div>
</div>

<div id="legend" class="panel">
  <h2 style="margin-top:0">凡例</h2>
  <div class="row"><span class="sw" style="height:8px;background:#62d682;box-shadow:inset 0 0 0 2px #3a9d57"></span> 高速道路</div>
  <div class="row"><span class="sw" style="height:8px;background:#ff7966;box-shadow:inset 0 0 0 2px #c4493a"></span> 国道</div>
  <div class="row"><span class="sw" style="height:8px;background:#ffd866;box-shadow:inset 0 0 0 2px #c9a02a"></span> 県道(都道府県道)</div>
  <div class="row"><span class="sw" style="height:8px;background:#fff;box-shadow:inset 0 0 0 2px #aab3bd"></span> 市町村道・私道・一般道路・生活道路</div>
  <div class="row"><span class="sw" id="tunnelSwatch" style="height:8px;box-shadow:inset 0 0 0 2px #aab3bd"></span> トンネル(グレーを混ぜた色・縁は破線)</div>
  <div class="row"><span class="sw" style="height:4px;background:#4a5563;box-shadow:0 0 0 2px #fff"></span> 鉄道(系統の色。白丸は駅)</div>
  <h2>太さ(車線数)</h2>
  <div id="lanesLegend"></div>
  <div class="meta" style="margin-top:6px;font-size:12px">未建設の道路は半透明で描きます。北は上です。</div>
</div>

<div id="info" class="panel">
  <div class="info-bar" id="infoBar"></div>
  <div class="inner">
    <button class="close" id="closeInfo" aria-label="閉じる">×</button>
    <h1 id="infoTitle"></h1>
    <dl id="infoBody"></dl>
  </div>
</div>

<div id="controls" class="controls">
  <div class="compass" title="北は上"><span class="arrow">▲</span>N</div>
  <button class="ctl" id="zoomIn" type="button" aria-label="拡大" title="拡大">+</button>
  <button class="ctl" id="zoomOut" type="button" aria-label="縮小" title="縮小">−</button>
  <button class="ctl" id="fitBtn" type="button" aria-label="全体を表示" title="全体を表示">⤢</button>
  <button class="ctl" id="originBtn" type="button" aria-label="原点へ" title="原点(0, 0)へ">◎</button>
</div>

<div id="scaleBar" class="panel"><div id="scaleLine"></div><span id="scaleText"></span></div>

<div id="coord" class="panel"></div>

<script>
(() => {
  const TYPE_LABEL = { residential: '生活道路', general: '一般道路', highway: '高速道路' };
  const MODE_LABEL = { earthwork: '土工', bridge: '橋梁', tunnel: 'トンネル' };
  const GRAY_HEX = '#8a939b';          // トンネルに混ぜるグレー
  const TUNNEL_TINT = 0.45;            // トンネルのグレーの割合
  const LANE_SAMPLES = [1, 2, 4, 6, 8];
  const ACCENT = '#1a73e8';

  // 道路の色(面と縁)。地図アプリのように、縁取りで道路を見分けやすくする
  const ROAD_STYLE = {
    highway:     { fill: '#62d682', casing: '#3a9d57' },
    general:     { fill: '#ffffff', casing: '#aab3bd' },
    residential: { fill: '#fafaf8', casing: '#c9d0d7' },
  };
  // 路線の区分による色(国道・県道)。市町村道・私道は白系(一般道路と同じ色)
  const ROUTE_STYLE = {
    national:    { fill: '#ff7966', casing: '#c4493a' },
    prefectural: { fill: '#ffd866', casing: '#c9a02a' },
    municipal:   { fill: '#ffffff', casing: '#aab3bd' },
    private:     { fill: '#ffffff', casing: '#aab3bd' },
  };
  const CATEGORY_LABEL = { national: '国道', prefectural: '都道府県道', municipal: '市町村道', private: '私道' };
  // 描く順(上に重なる順)。白い道路 → 県道 → 国道 → 高速道路
  const RANK = { national: 2, prefectural: 1 };
  const rankOf = (r) => (r.highway ? 3 : (RANK[r.category] || 0));
  const byRank = (list) => list.slice().sort((a, b) => rankOf(a) - rankOf(b));

  // ---- 地図画像の設定 ----
  // 地図は 3 × 3 に並ぶ。番号は左上から 1,2,3 / 4,5,6 / 7,8,9。ブロック5の中心が (0, 0)
  const MAP_COLS = 3, MAP_ROWS = 3;
  const TILE_W = 32768, TILE_H = 22528;          // 1枚が表すブロック数(= 元の画像の 8192×5632 px、1px = 4ブロック)
  const SRC_W = 8192, SRC_H = 5632;              // 元の画像の大きさ(px)
  const LEVELS = [512, 1024, 2048, 4096, 8192];  // 表示用に縮小して読む時の横幅(px)。小さく見る時は小さい方を読む
  const MAX_BYTES = 800 * 1024 * 1024;           // 同時に持つ地図の上限(概算。超えたら、画面外のものから手放す)
  const MAX_CONCURRENT = 2;                      // 同時に読み込む数
  const DEFAULT_DIR = 'images';                  // このHTMLと同じフォルダの中の地図画像を、最初に読む
  const MIN_SCALE = 0.002, MAX_SCALE = 40;

  const canvas = document.getElementById('map');
  const ctx = canvas.getContext('2d');
  const $ = (id) => document.getElementById(id);

  // 描画に使う色(テーマに合わせて CSS から読む)
  const T = { mapBg: '#f2efe9', halo: '#ffffff', ink: '#202124', railCasing: '#ffffff' };
  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    const g = (name, fallback) => cs.getPropertyValue(name).trim() || fallback;
    T.mapBg = g('--map-bg', '#f2efe9');
    T.halo = g('--halo', '#ffffff');
    T.ink = g('--ink', '#202124');
    T.railCasing = g('--rail-casing', '#ffffff');
  }

  const view = { cx: 0, cz: 0, scale: 4 };
  let roads = [];
  let selected = null;
  let hover = null;
  let needsDraw = true;
  let fileName = '';
  let frameNo = 0;
  let tileGen = 0;
  // 地図画像: 番号 -> { n, origin:{x,z}, src, bitmap(canvas), level, loading, failed, lastSeen, gen }
  let tiles = new Map();
  let sourceLabel = '';
  let blobUrls = [];
  const jobs = [];
  let activeJobs = 0;

  // 車線数で太さを変える(画面のピクセル。ズームしても同じ太さ)
  const lanePx = (lanes) => 2 + Math.max(1, lanes || 1) * 1.6;
  const visible = (r) => (r.highway ? $('showHighway').checked : $('showOther').checked)
    && (r.built || $('showUnbuilt').checked);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const dpr = () => window.devicePixelRatio || 1;

  // 2つの色を混ぜる(t=0 で a、t=1 で b)
  function mixHex(a, b, t) {
    const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
    const pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
    return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }
  // 道路の見た目(面・縁・トンネルかどうか)。トンネルは、グレーを混ぜて縁を破線にする
  function baseStyleOf(r) {
    if (r.highway) return ROAD_STYLE.highway;
    if (ROUTE_STYLE[r.category]) return ROUTE_STYLE[r.category];
    return r.type === 'residential' ? ROAD_STYLE.residential : ROAD_STYLE.general;
  }
  function styleOf(r) {
    const s = baseStyleOf(r);
    if (r.mode === 'tunnel') return { fill: mixHex(s.fill, GRAY_HEX, TUNNEL_TINT), casing: s.casing, tunnel: true };
    return { fill: s.fill, casing: s.casing, tunnel: false };
  }

  function resize() {
    canvas.width = Math.round(innerWidth * dpr());
    canvas.height = Math.round(innerHeight * dpr());
    ctx.setTransform(dpr(), 0, 0, dpr(), 0, 0);
    needsDraw = true;
  }
  const toScreen = (x, z) => [(x - view.cx) * view.scale + innerWidth / 2, (z - view.cz) * view.scale + innerHeight / 2];
  const toWorld = (sx, sy) => [(sx - innerWidth / 2) / view.scale + view.cx, (sy - innerHeight / 2) / view.scale + view.cz];

  // ---- 道路の線形(Mod の RoadRoute と同じ計算。書き出しの JSON には中心線を入れず、ここで計算する) ----
  // 向きの番号 0〜7(0 = +Z、2 = -X、4 = -Z、6 = +X。45度刻み)
  const DIR_DX = [0, -1, -1, -1, 0, 1, 1, 1];
  const DIR_DZ = [1, 1, 0, -1, -1, -1, 0, 1];
  const ROUTE_SPACING = 0.25;          // 中心線の点の間隔(ブロック)
  const QUARTER_TURN = Math.PI / 2;
  const ROUTE_EPS = 1e-9;

  const dirUnitX = (d) => DIR_DX[d] / Math.hypot(DIR_DX[d], DIR_DZ[d]);
  const dirUnitZ = (d) => DIR_DZ[d] / Math.hypot(DIR_DX[d], DIR_DZ[d]);
  // 向き (vx, vz) を角度 a(ラジアン)だけ回す
  const rotVec = (vx, vz, a) => {
    const c = Math.cos(a), s = Math.sin(a);
    return [vx * c - vz * s, vx * s + vz * c];
  };
  // 向き a から向き b へ回すときの角度(-π〜π)
  const turnAngle = (ax, az, bx, bz) => Math.atan2(ax * bz - az * bx, ax * bx + az * bz);

  // 向き (ux, uz) へ長さ length だけ直線を進む。点を out に足し、終点を返す
  function appendLineRoute(out, qx, qz, ux, uz, length) {
    if (!(length > ROUTE_EPS)) return [qx, qz];
    const n = Math.max(1, Math.ceil(length / ROUTE_SPACING));
    let x = qx, z = qz;
    for (let i = 1; i <= n; i++) {
      const t = length * i / n;
      x = qx + t * ux;
      z = qz + t * uz;
      out.push([x, z]);
    }
    return [x, z];
  }

  // 半径 radius の円弧を、(qx, qz) から向き (ux, uz) で出発して、phi 回転させる。点を out に足し、終点を返す
  function appendArcRoute(out, qx, qz, ux, uz, phi, radius) {
    const n = Math.max(2, Math.ceil(radius * Math.abs(phi) / ROUTE_SPACING));
    const left = rotVec(ux, uz, QUARTER_TURN);
    // 左へ曲がるとき(角度が正)は中心が左側、右へ曲がるとき(角度が負)は中心が右側になる
    const side = phi < 0 ? -1 : 1;
    let x = qx, z = qz;
    for (let i = 0; i <= n; i++) {
      const tau = phi * i / n;
      const heading = rotVec(ux, uz, tau);
      const headingLeft = rotVec(heading[0], heading[1], QUARTER_TURN);
      x = qx + side * radius * (left[0] - headingLeft[0]);
      z = qz + side * radius * (left[1] - headingLeft[1]);
      out.push([x, z]);
    }
    return [x, z];
  }

  // 直線 → 円弧1 → 直線 → 円弧2 → 直線 の中心線(始点は (x0, z0))
  function curvedRoutePts(x0, z0, sh) {
    const lead = Number(sh.lead) || 0, r1 = Number(sh.r1) || 0;
    const bridge = Number(sh.bridge) || 0, r2 = Number(sh.r2) || 0, tail = Number(sh.tail) || 0;
    const ux = dirUnitX(sh.start_dir), uz = dirUnitZ(sh.start_dir);
    const mx = Math.cos(sh.mid_angle), mz = Math.sin(sh.mid_angle);
    const ex = dirUnitX(sh.end_dir), ez = dirUnitZ(sh.end_dir);
    const phi1 = turnAngle(ux, uz, mx, mz);
    const phi2 = turnAngle(mx, mz, ex, ez);

    const out = [[x0, z0]];
    let p = appendLineRoute(out, x0, z0, ux, uz, lead);
    if (Math.abs(phi1) >= ROUTE_EPS) p = appendArcRoute(out, p[0], p[1], ux, uz, phi1, r1);
    p = appendLineRoute(out, p[0], p[1], mx, mz, bridge);
    if (Math.abs(phi2) >= ROUTE_EPS) p = appendArcRoute(out, p[0], p[1], mx, mz, phi2, r2);
    appendLineRoute(out, p[0], p[1], ex, ez, tail);
    return out;
  }

  // 道路の中心線の点(x, z の配列)。古い書き出し(centerline あり)はそのまま使う
  function centerlineOf(raw) {
    if (Array.isArray(raw.centerline)) return raw.centerline.map((p) => [p.x, p.z]);
    // ブロックの中心は、整数の座標に 0.5 を足したところ
    const x0 = raw.from.x + 0.5, z0 = raw.from.z + 0.5;
    if (!raw.shape || !raw.shape.curved) return [[x0, z0], [raw.to.x + 0.5, raw.to.z + 0.5]];
    return curvedRoutePts(x0, z0, raw.shape);
  }

  function normalize(raw) {
    let yMin = null, yMax = null;
    if (raw.height) {
      yMin = raw.height.min;
      yMax = raw.height.max;
    } else {
      // 古い書き出し(段ごとの高さ)
      const levels = Array.isArray(raw.level_y_by_step) ? raw.level_y_by_step : [];
      for (const y of levels) {
        if (yMin === null || y < yMin) yMin = y;
        if (yMax === null || y > yMax) yMax = y;
      }
    }
    return {
      id: raw.id, type: raw.type, highway: raw.type === 'highway', lanes: raw.lanes, mode: raw.mode,
      category: (raw.route && raw.route.category) || '',
      routeNumber: (raw.route && raw.route.number) || '',
      routeName: (raw.route && raw.route.name) || '',
      built: !!raw.built, length: raw.length, sidewalk: raw.sidewalk_width,
      from: raw.from, to: raw.to, dimension: raw.dimension, surface: raw.lane_surface,
      yMin, yMax,
      pts: centerlineOf(raw),
    };
  }

  function showError(msg) { $('error').textContent = msg; }

  function loadText(text, name) {
    let data;
    try { data = JSON.parse(text); }
    catch (e) { showError('JSONとして読めませんでした。'); return; }
    if (data && Array.isArray(data.sections)) { loadRailData(data, name); return; }
    if (Array.isArray(data) && data[0] && Array.isArray(data[0].routes)) { loadRouteData(data[0], name); return; }
    if (!data || data.format !== 'car_input.roads' || !Array.isArray(data.roads)) {
      showError('道路のエクスポートファイルではありません(car_input.roads)。');
      return;
    }
    showError('');
    roads = data.roads
      .filter((r) => r && r.from && r.to)
      .map(normalize);
    fileName = name;
    selected = null;
    showInfo(null);
    updateSummary(data);
    fitView();
    needsDraw = true;
  }

  function updateSummary(data) {
    const hw = roads.filter((r) => r.highway).length;
    const total = roads.reduce((sum, r) => sum + (r.length || 0), 0);
    const dims = [...new Set(roads.map((r) => r.dimension))];
    $('fileName').textContent = fileName;
    $('summary').textContent =
      `道路 ${roads.length} 本(高速道路 ${hw} 本)・合計 ${total} ブロック` +
      (dims.length ? `・${dims.join(', ')}` : '') +
      (data.exported_at ? `・書き出し ${new Date(data.exported_at).toLocaleString('ja-JP')}` : '');
  }

  // 道路があれば道路に合わせ、道路がなければ読み込んだ地図に合わせる
  function fitView() {
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    const grow = (x0, z0, x1, z1) => {
      minX = Math.min(minX, x0); maxX = Math.max(maxX, x1);
      minZ = Math.min(minZ, z0); maxZ = Math.max(maxZ, z1);
    };
    for (const r of roads) for (const [x, z] of r.pts) grow(x, z, x, z);
    if (rail) for (const sec of rail.sections) for (const [x, z] of sec.pts) grow(x, z, x, z);
    if (!roads.length && !rail) {
      for (const t of tiles.values()) grow(t.origin.x, t.origin.z, t.origin.x + TILE_W, t.origin.z + TILE_H);
    }
    if (!Number.isFinite(minX)) { view.cx = 0; view.cz = 0; view.scale = 4; return; }
    const w = Math.max(maxX - minX, 20), h = Math.max(maxZ - minZ, 20);
    view.scale = clamp(Math.min((innerWidth * 0.8) / w, (innerHeight * 0.8) / h), MIN_SCALE, MAX_SCALE);
    view.cx = (minX + maxX) / 2;
    view.cz = (minZ + maxZ) / 2;
  }

  // 縮尺バーの長さに使う、切りのよい距離(ブロック)
  function niceStep(raw) {
    const steps = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000];
    return steps.find((s) => s >= raw) || 200000;
  }

  // 縮尺バー(画面の下中央に、今の拡大率での長さを示す)
  function updateScale() {
    const blocks = niceStep(110 / view.scale);
    $('scaleLine').style.width = (blocks * view.scale) + 'px';
    $('scaleText').textContent = `${blocks} ブロック`;
  }

  // 縁取りを付けた道路(外側の縁 → 面 → 多車線の中央線の順に描く)
  function drawRoads() {
    const list = roads.filter(visible);
    // 白い道路を先に描き、県道・国道・高速道路の順に上に重ねる
    const ordered = byRank(list);
    for (const r of ordered) {
      const s = styleOf(r);
      strokeLine(r.pts, lanePx(r.lanes) + 3, s.casing, r.built ? 1 : 0.45, s.tunnel ? [5, 4] : null);
    }
    for (const r of ordered) {
      strokeLine(r.pts, lanePx(r.lanes), styleOf(r).fill, r.built ? 1 : 0.45);
    }
    for (const r of ordered) {
      if (r.highway && r.lanes >= 2) {
        strokeLine(r.pts, Math.max(1, lanePx(r.lanes) * 0.08), '#ffffff', (r.built ? 1 : 0.45) * 0.9, [6, 6]);
      }
    }
    if (selected && visible(selected)) {
      strokeLine(selected.pts, lanePx(selected.lanes) + 9, ACCENT, 0.35);
    }
    if (hover && hover !== selected && visible(hover)) {
      strokeLine(hover.pts, lanePx(hover.lanes) + 6, ACCENT, 0.2);
    }
  }

  // 原点(0, 0)の目印。控えめな十字
  function drawOrigin() {
    const [ox, oz] = toScreen(0, 0);
    if (ox < -20 || oz < -20 || ox > innerWidth + 20 || oz > innerHeight + 20) return;
    ctx.save();
    ctx.strokeStyle = ACCENT;
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(ox - 7, oz); ctx.lineTo(ox + 7, oz);
    ctx.moveTo(ox, oz - 7); ctx.lineTo(ox, oz + 7);
    ctx.stroke();
    ctx.restore();
  }

  function strokeLine(pts, width, color, alpha, dash) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    pts.forEach(([x, z], i) => {
      const [sx, sy] = toScreen(x, z);
      if (i) ctx.lineTo(sx, sy); else ctx.moveTo(sx, sy);
    });
    ctx.stroke();
    ctx.restore();
  }

  // ---- 地図画像(map_small1.jpg 〜 map_small9.jpg) ----

  // 番号 n の画像の左上の座標。ブロック5(中央)の中心が (0, 0)
  function tileOrigin(n) {
    const col = (n - 1) % MAP_COLS;
    const row = Math.floor((n - 1) / MAP_COLS);
    return {
      x: (col - (MAP_COLS - 1) / 2) * TILE_W - TILE_W / 2,
      z: (row - (MAP_ROWS - 1) / 2) * TILE_H - TILE_H / 2,
    };
  }

  function parseMapName(name) {
    const m = /^map_small(\d+)\.(jpe?g|png)$/i.exec(name);
    if (!m) return null;
    const n = Number(m[1]);
    return n >= 1 && n <= MAP_COLS * MAP_ROWS ? n : null;
  }

  function makeTile(n, src, bitmap, level) {
    return { n, origin: tileOrigin(n), src, bitmap, level, loading: false, failed: false, lastSeen: -1, gen: tileGen };
  }

  // 画面に必要な横幅に合う、読み込みサイズ(縮小して読むと、メモリと時間が減る)
  function neededLevel() {
    const want = TILE_W * view.scale * dpr();
    return LEVELS.find((L) => L >= want) || LEVELS[LEVELS.length - 1];
  }

  function releaseAll() {
    for (const t of tiles.values()) t.bitmap = null;
    for (const u of blobUrls) URL.revokeObjectURL(u);
    blobUrls = [];
    jobs.length = 0;
  }

  // 画像を、指定した横幅に縮めて小さいキャンバスに描く。ファイルは file:// でも読める
  function decodeTo(src, L) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          c.width = L;
          c.height = Math.round(L * SRC_H / SRC_W);
          const g = c.getContext('2d');
          g.imageSmoothingQuality = 'high';
          g.drawImage(img, 0, 0, c.width, c.height);
          img.src = '';
          resolve(c);
        } catch (e) { reject(e); }
      };
      img.onerror = () => reject(new Error('画像を読めません: ' + src));
      img.src = src;
    });
  }

  // 同梱フォルダ(images)の地図を、一番小さいサイズで先に読む。無い番号は空白のまま
  async function loadDefaultTiles() {
    releaseAll();
    const gen = ++tileGen;
    const found = new Map();
    for (let n = 1; n <= MAP_COLS * MAP_ROWS; n++) {
      if (gen !== tileGen) return; // 途中で別の画像を選ばれたら、この読み込みは止める
      const src = `${DEFAULT_DIR}/map_small${n}.jpg`;
      try {
        found.set(n, makeTile(n, src, await decodeTo(src, LEVELS[0]), LEVELS[0]));
      } catch (e) { /* 無い画像は空白のまま */ }
    }
    if (gen !== tileGen) return;
    if (!found.size) {
      $('bgStatus').textContent = `${DEFAULT_DIR} フォルダに地図画像(map_small1.jpg など)が見つかりません。「地図フォルダ」から選ぶこともできます。`;
      return;
    }
    tiles = found;
    sourceLabel = `${DEFAULT_DIR} フォルダ`;
    $('bgShow').checked = true;
    if (!roads.length && !rail) fitView();
    updateBgStatus();
    needsDraw = true;
  }

  function loadTileFiles(list) {
    const picked = new Map();
    let ignored = 0;
    for (const f of list) {
      const n = parseMapName(f.name);
      if (!n) { ignored++; continue; }
      if (!picked.has(n)) picked.set(n, f);
    }
    if (!picked.size) {
      $('bgStatus').textContent = '地図画像が見つかりませんでした。ファイル名は map_small1.jpg 〜 map_small9.jpg です。';
      return;
    }
    releaseAll();
    tileGen++;
    tiles = new Map();
    for (const [n, f] of picked) {
      const url = URL.createObjectURL(f);
      blobUrls.push(url);
      tiles.set(n, makeTile(n, url, null, 0));
    }
    sourceLabel = '選んだ画像';
    $('bgShow').checked = true;
    if (!roads.length && !rail) fitView();
    updateBgStatus(ignored);
    needsDraw = true;
  }

  function updateBgStatus(ignored = 0) {
    if (!tiles.size) { $('bgStatus').textContent = '背景の地図はまだありません'; return; }
    const total = MAP_COLS * MAP_ROWS;
    const have = [...tiles.keys()].sort((a, b) => a - b);
    const missing = [];
    for (let n = 1; n <= total; n++) if (!tiles.has(n)) missing.push(n);
    const parts = [`地図 ${have.length}/${total} 枚(${sourceLabel}・番号: ${have.join(', ')})`];
    if (missing.length) parts.push(`未配置: ${missing.join(', ')}(その部分は空白で表示)`);
    if (ignored) parts.push(`名前が合わない ${ignored} 件は無視`);
    $('bgStatus').textContent = parts.join(' ・ ');
  }

  function clearTiles() {
    releaseAll();
    tileGen++;
    tiles = new Map();
    sourceLabel = '';
    updateBgStatus();
    needsDraw = true;
  }

  // 表示に必要なサイズより粗い・細か過ぎる時だけ、読み直す(ズーム中に何度も読まないため)
  function wantLoad(t, need) {
    if (t.loading || t.failed) return false;
    if (!t.bitmap) return true;
    return t.level < need || t.level > need * 4;
  }

  function pumpJobs() {
    while (activeJobs < MAX_CONCURRENT && jobs.length) {
      const job = jobs.shift();
      activeJobs++;
      job().finally(() => { activeJobs--; pumpJobs(); needsDraw = true; });
    }
  }

  function requestLoad(t, L) {
    t.loading = true;
    const gen = t.gen;
    jobs.push(() => decodeTo(t.src, L)
      .then((c) => {
        if (gen !== tileGen) return;   // 読んでいる間に画像を入れ替えた時は、捨てる
        t.bitmap = c;
        t.level = L;
      }, () => { if (gen === tileGen && !t.bitmap) t.failed = true; })
      .finally(() => { if (gen === tileGen) t.loading = false; }));
    pumpJobs();
  }

  // 同時に持つ地図が多くなったら、今の画面に映っていないものから手放す
  function trimBitmaps() {
    const list = [...tiles.values()].filter((t) => t.bitmap);
    const bytes = (t) => t.level * (t.level * SRC_H / SRC_W) * 4;
    let total = list.reduce((sum, t) => sum + bytes(t), 0);
    if (total <= MAX_BYTES) return;
    const idle = list.filter((t) => t.lastSeen !== frameNo).sort((a, b) => a.lastSeen - b.lastSeen);
    for (const t of idle) {
      if (total <= MAX_BYTES) break;
      total -= bytes(t);
      t.bitmap = null;
      t.level = 0;
    }
  }

  function drawMap() {
    if (!tiles.size || !$('bgShow').checked) return;
    frameNo++;
    const need = neededLevel();
    const [wx0, wz0] = toWorld(0, 0);
    const [wx1, wz1] = toWorld(innerWidth, innerHeight);
    ctx.save();
    ctx.globalAlpha = Number($('bgAlpha').value) / 100;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    for (const t of tiles.values()) {
      const { x, z } = t.origin;
      // 画面に映っていない画像は、読み込みも描画もしない
      if (x + TILE_W < wx0 || x > wx1 || z + TILE_H < wz0 || z > wz1) continue;
      t.lastSeen = frameNo;
      if (wantLoad(t, need)) requestLoad(t, need);
      if (!t.bitmap) continue;
      // 隣の画像との境目に隙間が出ないよう、端を整数の画素に揃える
      const [sx0, sy0] = toScreen(x, z);
      const [sx1, sy1] = toScreen(x + TILE_W, z + TILE_H);
      const dx = Math.round(sx0), dy = Math.round(sy0);
      ctx.drawImage(t.bitmap, dx, dy, Math.round(sx1) - dx, Math.round(sy1) - dy);
    }
    ctx.restore();
    trimBitmaps();
  }

  // ---- 列車の現在位置(ローカルの API。ワールドに接続しているときだけ、列車が返る) ----
  // オプションをオンにしたときだけ取得する。オフの間は通信しない
  // 自動で取得する先(ローカルの列車API)。入力欄に URL があれば、そちらを使う
  const TRAIN_CANDIDATES = ['http://localhost:8765/api/trains'];
  const TRAIN_TIMEOUT_MS = 1500;
  const TRAIN_POLL_MS = 2000;
  let trains = [];
  let trainTimer = null;
  let trainBusy = false;
  const trainOn = () => $('showTrains').checked;

  function renderTrainList() {
    const box = $('trainList');
    box.replaceChildren(...trains.slice(0, 30).map((t) => {
      const div = document.createElement('div');
      const dest = parseStationName(t.destination).ja || '-';
      const next = parseStationName(t.nextStation).ja || '-';
      const delay = t.delaySec > 0 ? `・遅れ ${Math.round(t.delaySec)} 秒` : '';
      div.textContent = `${t.title || t.formation} ${jaName(t.routeNumber)} → ${dest}(次 ${next}${delay})`;
      return div;
    }));
  }

  // 1つの URL から JSON を取る(参考アプリと同じ取り方: GET・mode: cors)。
  // ステータスや中身の形は見ない。JSON として読めれば、そのまま返す
  async function fetchTrainJson(url) {
    let timer;
    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => reject(new Error('timeout')), TRAIN_TIMEOUT_MS);
    });
    try {
      const res = await Promise.race([fetch(url, { method: 'GET', mode: 'cors' }), timeout]);
      try {
        return { status: res.status, body: await res.json() };
      } catch (e) {
        return { error: `JSONではありません(HTTP ${res.status})` };
      }
    } catch (e) {
      if (e.message === 'timeout') return { error: '時間切れ' };
      return { error: await diagnoseTrainUrl(url) };
    } finally {
      clearTimeout(timer);
    }
  }
  // 応答の中の列車の一覧を探す。配列そのもの、または trains などの中の配列を使う。無ければ空
  function trainsFrom(body) {
    if (Array.isArray(body)) return body;
    if (body && typeof body === 'object') {
      for (const key of ['trains', 'data', 'items', 'list']) {
        if (Array.isArray(body[key])) return body[key];
      }
    }
    return [];
  }
  // 列車の座標などは数値に直すだけ(数値でなければ NaN のまま。描く時に飛ばす)
  function normalizeTrain(t) {
    const o = (t && typeof t === 'object') ? t : {};
    return { ...o, x: Number(o.x), z: Number(o.z), yaw: Number(o.yaw) };
  }
  // 失敗の理由を言葉にする。no-cors で届けば、サーバーは起動している(CORS か、ローカルネットワークの許可の問題)
  async function diagnoseTrainUrl(url) {
    try {
      await fetch(url, { method: 'GET', mode: 'no-cors' });
      return 'サーバーには届きますが、CORS またはローカルネットワークの許可の応答がありません';
    } catch (e) {
      return 'サーバーに届きません(起動していない、またはポートが違う、もしくはブラウザが通信を止めています)';
    }
  }

  async function pollTrains() {
    if (trainBusy || !trainOn()) return;
    trainBusy = true;
    const manual = $('trainUrl').value.trim();
    const urls = manual ? [manual] : TRAIN_CANDIDATES;
    const failures = [];
    let found = null;
    try {
      for (const url of urls) {
        const r = await fetchTrainJson(url);
        if (r.error) { failures.push(`${url}(${r.error})`); continue; }
        found = { url, status: r.status, body: r.body };
        break;
      }
      if (!found) {
        trains = [];
        let msg = `列車のAPIに接続できません。試したURL: ${failures.join(', ')}`;
        if (location.protocol === 'https:') {
          msg += '。共有ページ(https)から接続する時は、ローカルのAPIが CORS を許可し、' +
            'Access-Control-Allow-Private-Network: true を返す必要があります。' +
            'また、ブラウザのサイト設定で「ローカルネットワークへのアクセス」を許可してください。';
        }
        $('trainStatus').textContent = msg;
      } else {
        const body = found.body;
        trains = trainsFrom(body).map(normalizeTrain);
        let text = `接続済み(${found.url}・HTTP ${found.status})`;
        if (trains.length) {
          text += `・列車 ${trains.length} 本(${new Date().toLocaleTimeString('ja-JP')} 更新)`;
        } else if (body && typeof body === 'object' && body.error) {
          text += `・応答: ${body.error}`;
        } else {
          text += `・列車の一覧は見つかりませんでした(応答: ${String(JSON.stringify(body)).slice(0, 120)})`;
        }
        $('trainStatus').textContent = text;
      }
    } finally {
      trainBusy = false;
    }
    renderTrainList();
    needsDraw = true;
  }

  function setTrainMode(on) {
    clearInterval(trainTimer);
    trainTimer = null;
    trains = [];
    renderTrainList();
    if (!on) {
      $('trainStatus').textContent = '';
      needsDraw = true;
      return;
    }
    $('trainStatus').textContent = '列車を取得しています…';
    pollTrains();
    trainTimer = setInterval(pollTrains, TRAIN_POLL_MS);
  }
  $('showTrains').addEventListener('change', (e) => setTrainMode(e.target.checked));

  // 列車の印: 路線の色の丸、向き(ヨー角。Minecraft と同じ向き)の線、停車中は外側に輪、名前
  function drawTrains() {
    ctx.save();
    ctx.font = '600 12px system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    for (const t of trains) {
      if (!Number.isFinite(t.x) || !Number.isFinite(t.z)) continue;
      const [sx, sy] = toScreen(t.x, t.z);
      if (sx < -60 || sy < -60 || sx > innerWidth + 60 || sy > innerHeight + 60) continue;
      const fill = t.routeColor || '#4a5563';
      const rad = (Number(t.yaw) || 0) * Math.PI / 180;
      const dx = -Math.sin(rad), dz = Math.cos(rad);
      ctx.strokeStyle = T.ink;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + dx * 13, sy + dz * 13);
      ctx.stroke();
      if (t.atStop || t.dwelling) {
        ctx.beginPath();
        ctx.arc(sx, sy, 10, 0, Math.PI * 2);
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(sx, sy, 6.5, 0, Math.PI * 2);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = T.halo;
      ctx.stroke();
      const label = String(t.title || t.formation || '');
      ctx.lineWidth = 3;
      ctx.strokeStyle = T.halo;
      ctx.strokeText(label, sx + 10, sy - 10);
      ctx.fillStyle = T.ink;
      ctx.fillText(label, sx + 10, sy - 10);
    }
    ctx.restore();
  }

  function draw() {
    ctx.fillStyle = T.mapBg;
    ctx.fillRect(0, 0, innerWidth, innerHeight);
    drawMap();
    drawOrigin();
    if (roads.length) drawRoads();
    if (railOn()) drawRail();
    if (trainOn() && trains.length) drawTrains();
    updateScale();
  }

  function distToSeg(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    t = clamp(t, 0, 1);
    const cx = ax + t * dx - px, cy = ay + t * dy - py;
    return Math.hypot(cx, cy);
  }

  // 画面上の点に最も近い道路(線の太さの範囲内)
  // 描いた順(白い道路 → 県道 → 国道 → 高速道路)で見て、同じ距離なら後に描いた方(上に見える方)を選ぶ
  function pick(sx, sy) {
    let best = null, bestD = Infinity;
    const list = byRank(roads);
    for (const r of list) {
      if (!visible(r)) continue;
      const tol = lanePx(r.lanes) / 2 + 6;
      const pts = r.pts;
      for (let i = 1; i < pts.length; i++) {
        const [ax, ay] = toScreen(pts[i - 1][0], pts[i - 1][1]);
        const [bx, by] = toScreen(pts[i][0], pts[i][1]);
        const d = distToSeg(sx, sy, ax, ay, bx, by);
        if (d <= tol && d <= bestD) { bestD = d; best = r; }
      }
    }
    return best;
  }

  function addRow(dl, label, value) {
    const dt = document.createElement('dt'); dt.textContent = label;
    const dd = document.createElement('dd'); dd.textContent = value;
    dl.append(dt, dd);
  }

  function showInfo(r) {

    addRow(dl, '長さ', `${r.length} ブロック`);

  }

  function buildLanesLegend() {
    const box = $('lanesLegend');
    box.textContent = '';
    for (const n of LANE_SAMPLES) {

  }

  // ---- 鉄道(駅番号などは、駅を選んだ時の詳細欄にだけ出す) ----
  const RAIL_COLOR = '#4a5563';        // 鉄道の線(系統の色で塗らない時)
  const RAIL_LABEL_SCALE = 0.2;        // これより拡大した時だけ駅名を描く
  const CLUSTER_SIM = 0.7;             // 通る区間の一致率(Jaccard)がこれ以上の系統は、1本の路線にまとめる
  let rail = null;                     // { stations: Map, sections: [...], total }
  let selectedRail = null;             // { type: 'station', st } または { type: 'section', sec }
  const railOn = () => !!rail && $('showRail').checked;
  const stationName = (st) => (st ? (st.ja || st.en || '-') : '-');

  // 駅名の形式は「[駅番号][路線など]日本語|English」。[...] の部分を番号として取り出す
  function parseStationName(raw) {
    const text = String(raw || '');
    const codes = [...text.matchAll(/\[([^\]]*)\]/g)].map((m) => m[1]);
    const [ja = '', en = ''] = text.replace(/\[[^\]]*\]/g, '').split('|');
    return { codes, ja: ja.trim(), en: en.trim() };
  }

  function loadRailData(data, name) {
    const stations = new Map();
    const sections = [];
    const seen = new Set();
    let total = 0;
    for (const s of data.sections) {
      if (!s || !Array.isArray(s.points) || s.points.length < 2) continue;
      // 点は [x, y, z]。地図は平面なので、x と z だけ使う
      const pts = s.points.map((p) => [p[0], p[2]]);
      const from = parseStationName(s.from), to = parseStationName(s.to);
      const ends = [[s.fromStationId, from, pts[0]], [s.toStationId, to, pts[pts.length - 1]]];
      for (const [id, info, p] of ends) {
        if (!stations.has(id)) stations.set(id, { id, ...info, x: p[0], z: p[1], neighbors: [], lines: [] });
      }
      // 往復で同じ区間が2回入っているので、1回だけ使う
      const key = [s.fromStationId, s.toStationId].sort().join('|');
      if (seen.has(key)) continue;
      seen.add(key);
      const distance = Number(s.distanceM) || 0;
      sections.push({ key, fromId: s.fromStationId, toId: s.toStationId, distance, measured: !!s.measured, pts, routes: [], names: [] });
      total += distance;
      stations.get(s.fromStationId).neighbors.push({ id: s.toStationId, distance });
      stations.get(s.toStationId).neighbors.push({ id: s.fromStationId, distance });
    }
    rail = { stations, sections, total, platforms: [] };
    applyRoutes();
    selectedRail = null;
    $('railName').textContent = name;
    $('railSummary').textContent =
      `駅 ${stations.size} 駅・区間 ${sections.length} 本・合計 ${Math.round(total)} ブロック`;
    $('showRail').checked = true;
    fitView();
    needsDraw = true;
  }

  function loadRailText(text, name) {
    let data;
    try { data = JSON.parse(text); }
    catch (e) { $('railSummary').textContent = '鉄道のJSONとして読めませんでした。'; return; }
    if (!data || !Array.isArray(data.sections)) {
      $('railSummary').textContent = '鉄道データではありません(sections がありません)。';
      return;
    }
    loadRailData(data, name);
  }

  function readRailFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => loadRailText(String(reader.result), file.name);
    reader.readAsText(file, 'utf-8');
  }

  // ---- 系統データ(どの線路を通っているかを、駅の並びから推定する) ----
  let routeData = null;                // { routes, name }
  const routeColorOn = () => railOn() && !!routeData && $('showRouteColor').checked;
  const colorHex = (v) => '#' + (Number(v) & 0xffffff).toString(16).padStart(6, '0');
  const jaName = (raw) => String(raw || '').split('|')[0].trim() || '-';

  function loadRouteData(data, name) {
    routeData = { routes: data.routes, stations: data.stations || {}, positions: data.positions || {}, name };
    $('routeName').textContent = name;
    if (!rail) {
      $('routeSummary').textContent = '系統データを読み込みました。先に鉄道JSONを開くと、線路に色を付けます。';
      return;
    }
    applyRoutes();
  }

  function loadRouteText(text, name) {
    let data;
    try { data = JSON.parse(text); }
    catch (e) { $('routeSummary').textContent = '系統のJSONとして読めませんでした。'; return; }
    if (!Array.isArray(data) || !data[0] || !Array.isArray(data[0].routes)) {
      $('routeSummary').textContent = '系統データではありません(routes がありません)。';
      return;
    }
    loadRouteData(data[0], name);
  }

  function readRouteFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => loadRouteText(String(reader.result), file.name);
    reader.readAsText(file, 'utf-8');
  }

  // 駅の並びの2駅が区間として存在すれば、そのまま使う。無ければ、区間をつないだ最短経路で推定する
  function shortestPath(adj, src, dst) {
    if (!adj.has(src) || !adj.has(dst)) return null;
    const dist = new Map([[src, 0]]);
    const prev = new Map();
    const done = new Set();
    for (;;) {
      let u = null, best = Infinity;
      for (const [node, d] of dist) {
        if (!done.has(node) && d < best) { best = d; u = node; }
      }
      if (u === null) return null;
      if (u === dst) break;
      done.add(u);
      for (const e of adj.get(u) || []) {
        const nd = best + e.w;
        if (!dist.has(e.to) || nd < dist.get(e.to)) {
          dist.set(e.to, nd);
          prev.set(e.to, { from: u, key: e.key });
        }
      }
    }
    const keys = [];
    for (let cur = dst; cur !== src; cur = prev.get(cur).from) keys.push(prev.get(cur).key);
    return keys;
  }

  // ---- 線形の近さ(緩行線と急行線のように、ほぼ同じ場所を通る線路を1本にまとめるための判定) ----
  const GROUP_TOL = 12;                // この距離(ブロック)以内なら、同じ線路上とみなす
  const GROUP_COVER = 0.7;             // 相手の線形の7割以上がこの距離内にあれば、並行していると判定
  // 線を一定間隔(ブロック)の点に分ける
  function sampleLine(pts, step) {
    const out = [];
    for (let i = 0; i + 1 < pts.length; i++) {
      const [ax, az] = pts[i], [bx, bz] = pts[i + 1];
      const n = Math.max(1, Math.ceil(Math.hypot(bx - ax, bz - az) / step));
      for (let k = 0; k < n; k++) out.push([ax + (bx - ax) * k / n, az + (bz - az) * k / n]);
    }
    if (pts.length) out.push(pts[pts.length - 1]);
    return out;
  }
  // 点を GROUP_TOL の大きさの升目に振り分け、近くの点を探しやすくする
  function gridOf(samples) {
    const cells = new Map();
    for (const [x, z] of samples) {
      const key = Math.floor(x / GROUP_TOL) + ',' + Math.floor(z / GROUP_TOL);
      if (!cells.has(key)) cells.set(key, []);
      cells.get(key).push(x, z);
    }
    return cells;
  }
  // samples の各点のうち、grid の点から GROUP_TOL 以内にあるものの割合
  function coverFrac(samples, grid) {
    if (!samples.length) return 0;
    const t2 = GROUP_TOL * GROUP_TOL;
    let hit = 0;
    for (const [x, z] of samples) {
      const cx = Math.floor(x / GROUP_TOL), cz = Math.floor(z / GROUP_TOL);
      let ok = false;
      for (let i = -1; i <= 1 && !ok; i++) {
        for (let j = -1; j <= 1 && !ok; j++) {
          const cell = grid.get((cx + i) + ',' + (cz + j));
          if (!cell) continue;
          for (let p = 0; p < cell.length; p += 2) {
            const dx = cell[p] - x, dz = cell[p + 1] - z;
            if (dx * dx + dz * dz <= t2) { ok = true; break; }
          }
        }
      }
      if (ok) hit++;
    }
    return hit / samples.length;
  }
  // 区間の線形を、一度だけ点にして持っておく
  function secSamp(sec) {
    if (!sec._samp) {
      sec._samp = sampleLine(sec.pts, 15);
      sec._fine = sampleLine(sec.pts, 4);
      sec._grid = gridOf(sec._fine);
    }
    return sec._samp;
  }
  function secGrid(sec) { secSamp(sec); return sec._grid; }
  function secLength(sec) {
    let len = 0;
    for (let i = 1; i < sec.pts.length; i++) {
      len += Math.hypot(sec.pts[i][0] - sec.pts[i - 1][0], sec.pts[i][1] - sec.pts[i - 1][1]);
    }
    return len;
  }
  // 系統ごとに、通る区間の線形をまとめて持っておく(近さの判定に使う)
  function entryGeo(e, secByKey) {
    if (e.samp) return;
    const samp = [], fine = [];
    let x0 = Infinity, z0 = Infinity, x1 = -Infinity, z1 = -Infinity;
    for (const k of e.keys) {
      const sec = secByKey.get(k);
      if (!sec) continue;
      secSamp(sec);
      for (const p of sec._samp) samp.push(p);
      for (const p of sec._fine) fine.push(p);
      for (const [x, z] of sec.pts) {
        x0 = Math.min(x0, x); z0 = Math.min(z0, z); x1 = Math.max(x1, x); z1 = Math.max(z1, z);
      }
    }
    e.samp = samp;
    e.grid = gridOf(fine);
    e.box = [x0 - GROUP_TOL, z0 - GROUP_TOL, x1 + GROUP_TOL, z1 + GROUP_TOL];
  }
  const boxOverlap = (p, q) => p.box[0] <= q.box[2] && q.box[0] <= p.box[2] && p.box[1] <= q.box[3] && q.box[1] <= p.box[3];

  // ---- 駅の同一視(近い駅は同じ駅とみなす) ----
  const SNAP_RADIUS = 100;             // この距離(ブロック)以内の駅は、同じ駅とみなす候補
  // 駅ごとに、停車する系統の数を数える
  function stopCounts(routes) {
    const cnt = new Map();
    for (const route of routes) {
      const ids = new Set((route.stations || []).map((s) => String(s).split('_')[0]));
      for (const id of ids) cnt.set(id, (cnt.get(id) || 0) + 1);
    }
    return cnt;
  }
  // 駅 id を、同じ駅とみなした先の駅 id にする。候補が複数あれば「中心からの距離 ÷ 停車する系統数」が最も小さい駅を選ぶ。
  // 鉄道の駅どうしは、停車する系統が多い駅へだけ寄せる(寄せ先が増える向きだけなので、循環しない)
  function buildStationAlias(rail, routeData) {
    const stops = stopCounts(routeData.routes);
    const extra = routeData.stations || {};
    const posOf = (id) => {
      const st = rail.stations.get(id);
      if (st) return { x: st.x, z: st.z };
      const e = extra[id];
      return e && Number.isFinite(e.x) && Number.isFinite(e.z) ? { x: e.x, z: e.z } : null;
    };
    const geoIds = [...rail.stations.keys()];
    const allIds = new Set([...geoIds, ...stops.keys()]);
    const alias = new Map();
    for (const id of allIds) {
      const p = posOf(id);
      if (!p) continue;
      const own = stops.get(id) || 0;
      const isGeo = rail.stations.has(id);
      let best = null, bestScore = Infinity;
      for (const gid of geoIds) {
        if (gid === id) continue;
        const g = stops.get(gid) || 0;
        if (isGeo && g <= own) continue;
        const q = rail.stations.get(gid);
        const d = Math.hypot(p.x - q.x, p.z - q.z);
        if (d > SNAP_RADIUS) continue;
        const score = d / Math.max(1, g);
        if (score < bestScore) { bestScore = score; best = gid; }
      }
      if (best !== null) alias.set(id, best);
    }
    return alias;
  }
  function resolveAlias(alias, id) {
    let cur = id;
    for (let i = 0; i < 20 && alias.has(cur); i++) cur = alias.get(cur);
    return cur;
  }

  // ---- ホーム(系統データの停車位置を、駅ごとに近いものどうしでまとめ、線路の向きに沿った長方形にする) ----
  const PLATFORM_GAP = 12;             // この距離(ブロック)以内の停車位置は、同じホームとみなす
  const PLATFORM_LENGTH = 100;         // ホームの長さ(ブロック)。暫定値
  const PLATFORM_WIDTH = 4;            // ホームの幅(ブロック)
  const PLATFORM_SCALE = 0.2;          // これより拡大した時だけホームを描く
  const PLATFORM_FILL = '#e8523f';     // ホームの塗りつぶし
  const PLATFORM_DIR_MAX = 60;         // ホームの中心からこの距離(ブロック)以内に線路が無ければ、vertical の向きを使う

  // ホームの中心に最も近い線路の区間の向き(単位ベクトル)を返す
  function trackDirectionNear(sections, cx, cz) {
    let best = null, bestD = Infinity;
    for (const sec of sections) {
      const p = sec.pts;
      for (let i = 1; i < p.length; i++) {
        const ax = p[i - 1][0], az = p[i - 1][1];
        const dx = p[i][0] - ax, dz = p[i][1] - az;
        const L2 = dx * dx + dz * dz;
        if (L2 === 0) continue;
        const t = Math.max(0, Math.min(1, ((cx - ax) * dx + (cz - az) * dz) / L2));
        const d = Math.hypot(cx - (ax + dx * t), cz - (az + dz * t));
        if (d < bestD) { bestD = d; best = [dx / Math.sqrt(L2), dz / Math.sqrt(L2)]; }
      }
    }
    return bestD <= PLATFORM_DIR_MAX ? best : null;
  }

  // vertical が true の停車位置は線路が Z 方向に走っている(地図上で確認済み)。線路が見つからない時の向きに使う
  function buildPlatforms(rail, routeData, canon) {
    const byStation = new Map();
    for (const [key, v] of Object.entries(routeData.positions || {})) {
      if (!v || !Number.isFinite(v.x) || !Number.isFinite(v.y)) continue;
      const sid = canon(key.split('_')[0]);
      if (!byStation.has(sid)) byStation.set(sid, []);
      byStation.get(sid).push({ x: v.x, z: v.y, vertical: !!v.vertical });   // 位置の y は、地図の z
    }
    const platforms = [];
    for (const [sid, list] of byStation) {
      const par = list.map((_, i) => i);
      const find = (x) => { while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; };
      for (let i = 0; i < list.length; i++) {
        for (let j = i + 1; j < list.length; j++) {
          if (Math.hypot(list[i].x - list[j].x, list[i].z - list[j].z) <= PLATFORM_GAP) par[find(i)] = find(j);
        }
      }
      const groups = new Map();
      list.forEach((pt, i) => {
        const r = find(i);
        if (!groups.has(r)) groups.set(r, []);
        groups.get(r).push(pt);
      });
      for (const pts of groups.values()) {
        const xs = pts.map((q) => q.x), zs = pts.map((q) => q.z);
        const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cz = (Math.min(...zs) + Math.max(...zs)) / 2;
        const vertical = pts.filter((q) => q.vertical).length * 2 >= pts.length;
        const dir = trackDirectionNear(rail.sections, cx, cz) || (vertical ? [0, 1] : [1, 0]);
        const [ux, uz] = dir;
        platforms.push({ station: sid, cx, cz, ux, uz, lanes: 1 });
      }
    }
    return platforms;
  }

  const LANE_GAP_PX = 5;               // 系統を横に並べる間隔(px)。基準の拡大率での値
  const LINE_WIDTH_PX = 3;             // 系統の線の太さ(px)。基準の拡大率での値
  const LINE_REF_SCALE = 0.25;         // この拡大率より大きい時だけ、線の太さと間隔が拡大率に比例して太くなる
  const PLATFORM_LANE_PAD = 8;         // 並んだ系統の束の外側に足す余白(px)
  const PLATFORM_REF_SCALE = 0.25;     // この拡大率で、並ぶ系統の束がちょうど収まる幅になる。これより拡大すると、幅もその比で大きくなる
  const PLATFORM_LANE_NEAR = 30;       // ホームからこの距離(ブロック)以内の区間の中で、最も多く並ぶ系統数を使う
  // 線(点の並び)と点 (x, z) の最短距離
  function polyDist(pts, x, z) {
    let best = Infinity;
    for (let i = 1; i < pts.length; i++) {
      const ax = pts[i - 1][0], az = pts[i - 1][1];
      const dx = pts[i][0] - ax, dz = pts[i][1] - az;
      const L2 = dx * dx + dz * dz;
      const t = L2 ? Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / L2)) : 0;
      best = Math.min(best, Math.hypot(x - (ax + dx * t), z - (az + dz * t)));
    }
    return best;
  }
  // ホームの近くを通る区間で、最も多くの系統が横に並んで描かれる数
  function platformLanes(pf, sections) {
    let n = 1;
    for (const sec of sections) {
      if (sec.routes.length <= n) continue;
      if (polyDist(sec.pts, pf.cx, pf.cz) <= PLATFORM_LANE_NEAR) n = sec.routes.length;
    }
    return n;
  }

  function applyRoutes() {
    if (!rail || !routeData) return;
    const secByKey = new Map();
    const adj = new Map();
    const alias = buildStationAlias(rail, routeData);
    const canon = (id) => resolveAlias(alias, id);
    rail.platforms = buildPlatforms(rail, routeData, canon);
    const pairSec = new Map();           // 同じ駅どうしの組 → 区間(組ごとに1本を使う)
    for (const sec of rail.sections) {
      sec.routes = [];
      sec.names = [];
      sec.drawn = false;
      sec.absorbed = false;
      secByKey.set(sec.key, sec);
      const ca = canon(sec.fromId), cb = canon(sec.toId);
      if (ca === cb) continue;
      const pk = [ca, cb].sort().join('|');
      if (!pairSec.has(pk)) pairSec.set(pk, sec);
      for (const [a, b] of [[ca, cb], [cb, ca]]) {
        if (!adj.has(a)) adj.set(a, []);
        adj.get(a).push({ to: b, w: sec.distance || 1, key: sec.key });
      }
    }
    for (const st of rail.stations.values()) st.lines = [];
    let nDirect = 0, nEstimated = 0, nFailed = 0;
    let entries = [];
    for (const route of routeData.routes) {
      const info = { name: jaName(route.name), color: colorHex(route.color) };
      const routeKeys = new Set();
      const ids = (route.stations || []).map((s) => canon(String(s).split('_')[0]));
      for (let i = 1; i < ids.length; i++) {
        const a = ids[i - 1], b = ids[i];
        if (a === b) continue;
        let keys;
        const direct = pairSec.get([a, b].sort().join('|'));
        if (direct) {
          keys = [direct.key];
          nDirect++;
        } else {
          keys = shortestPath(adj, a, b);
          if (keys) nEstimated++;
          else { nFailed++; continue; }
        }
        for (const k of keys) routeKeys.add(k);
      }
      if (!routeKeys.size) continue;
      entries.push({ info, keys: routeKeys, ids, stops: ids.length, hidden: false });
    }
    // 同じ色で、経由する区間がほぼ同じ系統(種別の違いなど)は、停車駅が一番多い1本だけを残す
    let nHidden = 0;
    if ($('hideDup').checked) {
      const sim = (a, b) => {
        let inter = 0;
        for (const k of a) if (b.has(k)) inter++;
        return inter / (a.size + b.size - inter);
      };
      const kept = [];
      for (const e of [...entries].sort((x, y) => y.stops - x.stops)) {
        const dup = kept.some((k) => k.info.color === e.info.color && sim(k.keys, e.keys) >= CLUSTER_SIM);
        if (dup) { e.hidden = true; nHidden++; } else kept.push(e);
      }
    }
    entries = entries.filter((e) => !e.hidden);
    // 通る区間の大半が同じ系統(緩行・急行など、経由地が近接する並行の線路)は、1本の路線にまとめる
    const par = entries.map((_, i) => i);
    const find = (x) => { while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; };
    for (const e of entries) entryGeo(e, secByKey);
    for (let i = 0; i < entries.length; i++) {
      for (let j = i + 1; j < entries.length; j++) {
        if (find(i) === find(j)) continue;
        const a = entries[i], b = entries[j];
        let inter = 0;
        for (const k of a.keys) if (b.keys.has(k)) inter++;
        const union = a.keys.size + b.keys.size - inter;
        let same = union > 0 && inter / union >= CLUSTER_SIM;
        // 経由する区間が違っても、線形がほぼ重なっていれば(緩行線と急行線など)同じ路線とみなす
        if (!same && boxOverlap(a, b)) {
          same = coverFrac(a.samp, b.grid) >= GROUP_COVER && coverFrac(b.samp, a.grid) >= GROUP_COVER;
        }
        if (same) par[find(i)] = find(j);
      }
    }
    const clusters = new Map();
    entries.forEach((e, i) => {
      const root = find(i);
      if (!clusters.has(root)) clusters.set(root, { keys: new Set(), members: [] });
      const c = clusters.get(root);
      for (const k of e.keys) c.keys.add(k);
      c.members.push(e.info);
    });
    let nMerged = 0;
    // 同じ路線と判定された系統は、色や停車駅が違っても1本にまとめず、系統ごとに横に並べて描く
    let clusterNo = 0;
    for (const c of clusters.values()) {
      const uniq = new Map();
      for (const m of c.members) uniq.set(m.name + '|' + m.color, m);
      const members = [...uniq.values()].sort((a, b) => (a.color < b.color ? -1 : a.color > b.color ? 1 : a.name < b.name ? -1 : 1));
      if (members.length > 1) nMerged++;
      const no = clusterNo++;
      const lanes = members.map((m) => ({ ...m, cluster: no }));
      // 路線の区間のうち、長い区間とほぼ重なるもの(並行する線路)は、長い方の1本にまとめて描く
      const secs = [...c.keys].map((k) => secByKey.get(k)).filter(Boolean).sort((a, b) => secLength(b) - secLength(a));
      const shown = [];
      for (const sec of secs) {
        if (shown.some((d) => coverFrac(secSamp(sec), secGrid(d)) >= GROUP_COVER)) { sec.absorbed = true; continue; }
        sec.drawn = true;
        shown.push(sec);
      }
      // 描く区間には、路線の全系統を横並びで載せる(拡大すると、その路線を通る系統がすべて見える)
      for (const sec of shown) {
        for (const lane of lanes) {
          if (!sec.routes.some((r) => r.name === lane.name && r.color === lane.color)) sec.routes.push(lane);
        }
      }
      for (const sec of secs) {
        for (const m of members) if (!sec.names.includes(m.name)) sec.names.push(m.name);
      }
    }
    // 並行して重なるだけの区間は描かない(長い方の区間に任せる)
    let nAbsorbed = 0;
    for (const sec of rail.sections) {
      sec.skipDraw = !!sec.absorbed && !sec.drawn;
      if (sec.skipDraw) nAbsorbed++;
    }
    for (const pf of rail.platforms) pf.lanes = platformLanes(pf, rail.sections);
    // 駅に停まる系統は、表示している系統だけを載せる
    for (const e of entries) {
      for (const id of e.ids) {
        const st = rail.stations.get(id);
        if (st && !st.lines.some((l) => l.name === e.info.name && l.color === e.info.color)) st.lines.push(e.info);
      }
    }
    $('routeSummary').textContent =
      `系統 ${routeData.routes.length} 本(非表示 ${nHidden} 本)を路線 ${clusters.size} 本にまとめました(うち並行する系統をまとめた路線 ${nMerged} 本、重なって描かない区間 ${nAbsorbed} 本)・ホーム ${rail.platforms.length} か所・同じ駅とみなした駅 ${alias.size} 件・駅の並び ${nDirect} 組は区間に一致 / ${nEstimated} 組は推定 / ${nFailed} 組は対応できず`;
    needsDraw = true;
  }

  // 1本の区間の、系統を並べた帯の太さ(px)
  function sectionBandWidth(sec) {
    const k = Math.max(1, view.scale / LINE_REF_SCALE);
    const n = Math.max(1, sec.routes.length);
    return (n - 1) * LANE_GAP_PX * k + LINE_WIDTH_PX * k;
  }

  // 1本の区間を、通る系統の色で描く。複数の系統が通る区間は、色の帯を並べて見せる
  function drawSectionColored(sec) {
    if (!sec.routes.length) { strokeLine(sec.pts, 2, '#9aa3ab', 0.9); return; }
    // 路線ごと・色ごとに並べ順を固定し、区間が変わっても線の位置がずれないようにする
    const lanes = sec.routes.slice().sort((a, b) => a.cluster - b.cluster || (a.color < b.color ? -1 : a.color > b.color ? 1 : 0));
    // 向きは番号の小さい駅からにそろえる(隣の区間と並び順が反転しないように)
    const pts = sec.fromId <= sec.toId ? sec.pts : sec.pts.slice().reverse();
    const k = Math.max(1, view.scale / LINE_REF_SCALE);   // 拡大率が基準より大きい時は、太さと間隔を同じ比で大きくする
    const n = lanes.length, gap = LANE_GAP_PX * k;
    lanes.forEach((lane, i) => strokeOffset(pts, (i - (n - 1) / 2) * gap, LINE_WIDTH_PX * k, lane.color));
  }

  // 線を、法線方向に一定のピクセル数だけずらして描く(横並びの複数線用)
  function strokeOffset(pts, offsetPx, width, color) {
    const s = pts.map(([x, z]) => toScreen(x, z));
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    s.forEach((p, i) => {
      const a = s[Math.max(0, i - 1)], b = s[Math.min(s.length - 1, i + 1)];
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const len = Math.hypot(dx, dy) || 1;
      const x = p[0] - dy / len * offsetPx, y = p[1] + dx / len * offsetPx;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    });
    ctx.stroke();
    ctx.restore();
  }

  function drawRail() {
    const hiSec = selectedRail && selectedRail.type === 'section' ? selectedRail.sec : null;
    const hiSt = selectedRail && selectedRail.type === 'station' ? selectedRail.st : null;
    const colored = routeColorOn();
    const list = rail.sections.filter((s) => s !== hiSec && (!colored || !s.skipDraw));
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    // 1) 白い縁(線路を地図から浮かせて見やすくする)
    for (const sec of list) {
      strokeLine(sec.pts, colored ? sectionBandWidth(sec) + 3 : 5, T.railCasing, 1);
    }
    // 2) 線路本体
    if (colored) {
      for (const sec of list) drawSectionColored(sec);
    } else {
      for (const sec of list) strokeLine(sec.pts, 2.5, RAIL_COLOR, 1);
    }
    if (hiSec) strokeLine(hiSec.pts, 9, ACCENT, 0.5);
    drawPlatforms();
    // 駅の丸印(白に濃い縁。選んだ駅は青)
    for (const st of rail.stations.values()) {
      const [sx, sy] = toScreen(st.x, st.z);
      ctx.beginPath();
      ctx.arc(sx, sy, st === hiSt ? 6.5 : 4.5, 0, Math.PI * 2);
      ctx.fillStyle = st === hiSt ? ACCENT : '#ffffff';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = st === hiSt ? '#ffffff' : T.ink;
      ctx.stroke();
    }
    // 駅名(白や黒の縁取りで、地図の上でも読めるようにする)
    if (view.scale >= RAIL_LABEL_SCALE) {
      ctx.font = '600 12px system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 4;
      ctx.strokeStyle = T.halo;
      ctx.fillStyle = T.ink;
      for (const st of rail.stations.values()) {
        const [sx, sy] = toScreen(st.x, st.z);
        const label = st.ja || st.en;
        ctx.strokeText(label, sx + 8, sy + 4);
        ctx.fillText(label, sx + 8, sy + 4);
      }
    }
    ctx.restore();
  }

  // ホームを長方形で描く。同じ駅のホームは、駅の中心から点線で結んで1つの駅だとわかるようにする
  function drawPlatforms() {
    if (!rail.platforms || !rail.platforms.length || view.scale < PLATFORM_SCALE) return;
    ctx.save();
    ctx.strokeStyle = RAIL_COLOR;
    ctx.setLineDash([3, 3]);
    ctx.lineWidth = 1;
    for (const pf of rail.platforms) {
      const st = rail.stations.get(pf.station);
      if (!st) continue;
      const [sx, sy] = toScreen(st.x, st.z);
      const [cx, cy] = toScreen(pf.cx, pf.cz);
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(cx, cy);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    for (const pf of rail.platforms) {
      const hi = selectedRail && selectedRail.type === 'station' && pf.station === selectedRail.st.id;
      ctx.beginPath();
      platformCorners(pf).forEach(([x, y], i) => { if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
      ctx.closePath();
      ctx.fillStyle = PLATFORM_FILL;
      ctx.fill();
      ctx.lineWidth = hi ? 3.5 : 1.5;
      ctx.strokeStyle = hi ? ACCENT : '#ffffff';
      ctx.stroke();
    }
    ctx.restore();
  }

  // ホームの四隅(画面上の座標)。向きは画面上の向きにそろえ、長さは100ブロック、幅は並ぶ系統の束が収まる幅(px)以上
  function platformCorners(pf) {
    const [cx, cy] = toScreen(pf.cx, pf.cz);
    const [ex, ey] = toScreen(pf.cx + pf.ux, pf.cz + pf.uz);
    let ax = ex - cx, ay = ey - cy;
    const al = Math.hypot(ax, ay) || 1;
    ax /= al; ay /= al;
    const nx = -ay, ny = ax;
    const hl = PLATFORM_LENGTH / 2 * view.scale;
    // 半幅(px)。系統の束が収まる幅を基準にし、基準の拡大率より大きい時は拡大率に比例して広げる
    const bundlePx = ((pf.lanes - 1) / 2) * LANE_GAP_PX + PLATFORM_LANE_PAD;
    const hw = Math.max(PLATFORM_WIDTH / 2 * view.scale, bundlePx, bundlePx / PLATFORM_REF_SCALE * view.scale);
    return [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => [
      cx + ax * hl * a + nx * hw * b,
      cy + ay * hl * a + ny * hw * b,
    ]);
  }

  // 点が四角形の内側にあるか(四角形の辺の外積の符号がそろっているか)
  function pointInQuad(q, x, y) {
    let pos = 0, neg = 0;
    for (let i = 0; i < 4; i++) {
      const [ax, ay] = q[i], [bx, by] = q[(i + 1) % 4];
      const cr = (bx - ax) * (y - ay) - (by - ay) * (x - ax);
      if (cr > 0) pos++; else if (cr < 0) neg++;
    }
    return pos === 0 || neg === 0;
  }

  // ホームの長方形をクリックしたら、そのホームの駅を選ぶ。重なる時は、中心に近いホームを選ぶ
  function pickPlatform(sx, sy) {
    if (view.scale < PLATFORM_SCALE) return null;
    let best = null, bestD = Infinity;
    for (const pf of rail.platforms) {
      const q = platformCorners(pf);
      if (!pointInQuad(q, sx, sy)) continue;
      const [cx, cy] = toScreen(pf.cx, pf.cz);
      const d = Math.hypot(cx - sx, cy - sy);
      if (d < bestD) { bestD = d; best = pf; }
    }
    return best;
  }

  // 駅は点の近くで選ぶ
  function pickStation(sx, sy) {
    let best = null, bestD = 10;
    for (const st of rail.stations.values()) {
      const [x, y] = toScreen(st.x, st.z);
      const d = Math.hypot(x - sx, y - sy);
      if (d <= bestD) { bestD = d; best = st; }
    }
    return best;
  }

  // 区間は線の近くで選ぶ
  function pickRailSection(sx, sy) {
    let best = null, bestD = 6;
    for (const sec of rail.sections) {
      if (routeColorOn() && sec.skipDraw) continue;
      for (let i = 1; i < sec.pts.length; i++) {
        const [ax, ay] = toScreen(sec.pts[i - 1][0], sec.pts[i - 1][1]);
        const [bx, by] = toScreen(sec.pts[i][0], sec.pts[i][1]);
        const d = distToSeg(sx, sy, ax, ay, bx, by);
        if (d <= bestD) { bestD = d; best = sec; }
      }
    }
    return best;
  }

  function showRailInfo(item) {
    const box = $('info');
    const dl = $('infoBody');
    dl.textContent = '';
    $('infoBar').style.background = RAIL_COLOR;
    if (item.type === 'station') {
      const st = item.st;
      $('infoTitle').textContent = `${stationName(st)} 駅`;
      addRow(dl, '英語名', st.en || '-');
      addRow(dl, '駅番号', st.codes.length ? st.codes.join(' ・ ') : '-');
      addRow(dl, '座標', `X ${Math.round(st.x)}, Z ${Math.round(st.z)}`);
      addRow(dl, '接続', `${st.neighbors.length} 方面`);
      addRow(dl, '系統', st.lines.length ? st.lines.map((l) => l.name).join(' ・ ') : '-');
      for (const nb of st.neighbors) {
        addRow(dl, '隣の駅', `${stationName(rail.stations.get(nb.id))}(${Math.round(nb.distance)} ブロック)`);
      }
    } else {
      const sec = item.sec;
      $('infoTitle').textContent = '鉄道区間';
      addRow(dl, '区間', `${stationName(rail.stations.get(sec.fromId))} ⇔ ${stationName(rail.stations.get(sec.toId))}`);
      addRow(dl, '距離', `${Math.round(sec.distance)} ブロック`);
      addRow(dl, '計測', sec.measured ? '計測済み' : '未計測');
      const names = sec.names || [];
      addRow(dl, '通る系統', names.length ? names.join(' ・ ') : '推定なし');
    }
    box.style.display = 'block';
  }

  // ---- 起動時の自動読み込み(HTML と同じフォルダの rail.json・train.json・road.json) ----
  // 鉄道 → 系統 → 道路の順に読む(系統は、鉄道を読んだ後に線路へ色を付ける)
  const DATA_FILES = [
    { kind: 'rail', name: 'rail.json' },
    { kind: 'train', name: 'train.json' },
    { kind: 'road', name: 'road.json' },
  ];
  // 種類に合った読み込み関数へ渡す。読めなかった時のエラーは、それぞれの欄に出る
  function applyData(kind, text, name) {
    if (kind === 'rail') loadRailText(text, name);
    else if (kind === 'train') loadRouteText(text, name);
    else loadText(text, name);
  }
  function setAutoStatus(lines, isError = false) {
    const box = $('autoStatus');
    box.style.color = isError ? 'var(--danger)' : '';
    box.replaceChildren(...lines.map((text) => {
      const div = document.createElement('div');
      div.textContent = text;
      return div;
    }));
  }
  // 起動時: HTML と同じフォルダから、Web サーバー経由なら読める。ファイルを直接開いた時は読めない(ブラウザの制限)
  async function autoLoadData() {
    const lines = [];
    let blocked = false;
    for (const d of DATA_FILES) {
      let res;
      try {
        res = await fetch(d.name, { cache: 'no-store' });
      } catch (e) {
        blocked = true;
        lines.push(`${d.name}: 自動では読めません`);
        continue;
      }
      if (!res.ok) { lines.push(`${d.name}: 見つかりません`); continue; }
      applyData(d.kind, await res.text(), d.name);
      lines.push(`${d.name}: 読み込みました`);
    }
    if (blocked) {
      lines.push('このHTMLを直接開いているため、自動では読めません。「データフォルダから読む」で、HTMLと同じフォルダを選んでください。');
      setAutoStatus(lines, true);
    } else {
      setAutoStatus(lines);
    }
  }
  function readText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => reject(reader.error);
      reader.readAsText(file, 'utf-8');
    });
  }
  // 選んだフォルダの中から3つのファイルを探す(同じ名前が下の階層にもあれば、一番浅いものを使う)
  async function loadDataFolder(list) {
    const found = {};
    for (const f of list) {
      const hit = DATA_FILES.find((d) => d.name === f.name);
      if (!hit) continue;
      const depth = (f.webkitRelativePath || f.name).split('/').length;
      if (!found[hit.kind] || depth < found[hit.kind].depth) found[hit.kind] = { file: f, depth };
    }
    const lines = [];
    for (const d of DATA_FILES) {
      const hit = found[d.kind];
      if (!hit) { lines.push(`${d.name}: フォルダに見つかりません`); continue; }
      applyData(d.kind, await readText(hit.file), d.name);
      lines.push(`${d.name}: 読み込みました`);
    }
    setAutoStatus(lines);
  }

  // 入力
  $('file').addEventListener('change', (e) => readFile(e.target.files[0]));
  $('railFile').addEventListener('change', (e) => readRailFile(e.target.files[0]));
  $('routeFile').addEventListener('change', (e) => readRouteFile(e.target.files[0]));
  $('dataDir').addEventListener('change', (e) => {
    const list = Array.from(e.target.files || []);
    e.target.value = ''; // 同じフォルダを選び直しても反応するように
    if (list.length) loadDataFolder(list);
  });
  $('showRouteColor').addEventListener('change', () => { needsDraw = true; });
  $('hideDup').addEventListener('change', () => applyRoutes());
  $('showRail').addEventListener('change', () => {
    if (!railOn() && selectedRail) showInfo(null);
    needsDraw = true;
  });
  function readFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => loadText(String(reader.result), file.name);
    reader.readAsText(file, 'utf-8');
  }
  ['bgDir', 'bgFiles'].forEach((id) => $(id).addEventListener('change', (e) => {
    const list = Array.from(e.target.files || []);
    e.target.value = ''; // 同じフォルダを選び直しても反応するように
    if (list.length) loadTileFiles(list);
  }));
  $('bgClear').addEventListener('click', clearTiles);
  ['bgShow', 'bgAlpha'].forEach((id) => $(id).addEventListener('input', () => { needsDraw = true; }));
  ['showHighway', 'showOther', 'showUnbuilt'].forEach((id) => $(id).addEventListener('change', () => {
    if (selected && !visible(selected)) { selected = null; showInfo(null); }
    needsDraw = true;
  }));
  $('closeInfo').addEventListener('click', () => { selected = null; showInfo(null); needsDraw = true; });

  // メニューの開閉
  $('toggleTop').addEventListener('click', () => { $('top').classList.toggle('collapsed'); });

  // 地図の操作ボタン(拡大・縮小は画面の中心を基準にする)
  function zoomBy(f) {
    view.scale = clamp(view.scale * f, MIN_SCALE, MAX_SCALE);
    needsDraw = true;
  }
  $('zoomIn').addEventListener('click', () => zoomBy(2));
  $('zoomOut').addEventListener('click', () => zoomBy(0.5));
  $('fitBtn').addEventListener('click', () => { fitView(); needsDraw = true; });
  $('originBtn').addEventListener('click', () => { view.cx = 0; view.cz = 0; needsDraw = true; });

  let dragCount = 0;
  window.addEventListener('dragenter', (e) => { e.preventDefault(); dragCount++; $('drop').style.display = 'flex'; });
  window.addEventListener('dragleave', () => { dragCount = Math.max(0, dragCount - 1); if (!dragCount) $('drop').style.display = 'none'; });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    dragCount = 0;
    $('drop').style.display = 'none';
    const files = Array.from(e.dataTransfer.files);
    if (files.some((f) => parseMapName(f.name))) loadTileFiles(files);
    else if (files.length) readFile(files[0]);
  });

  // 地図の操作
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, y: e.clientY, cx: view.cx, cz: view.cz, moved: false };
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', (e) => {
    const [wx, wz] = toWorld(e.clientX, e.clientY);
    $('coord').textContent = `X ${Math.round(wx)}   Z ${Math.round(wz)}`;
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
      view.cx = drag.cx - dx / view.scale;
      view.cz = drag.cz - dy / view.scale;
      needsDraw = true;
      return;
    }
    const h = pick(e.clientX, e.clientY);
    if (h !== hover) {
      hover = h;
      canvas.style.cursor = h ? 'pointer' : '';
      needsDraw = true;
    }
  });
  canvas.addEventListener('pointerup', (e) => {
    if (drag && !drag.moved) {
      // 駅の丸印 → ホームの長方形 → 道路 → 鉄道の区間の順に、近いものを選ぶ
      let st = railOn() ? pickStation(e.clientX, e.clientY) : null;
      if (!st && railOn()) {
        const pf = pickPlatform(e.clientX, e.clientY);
        if (pf) st = rail.stations.get(pf.station) || null;
      }
      if (st) {
        selected = null;
        selectedRail = { type: 'station', st };
        showRailInfo(selectedRail);
      } else {
        selected = pick(e.clientX, e.clientY);
        const sec = !selected && railOn() ? pickRailSection(e.clientX, e.clientY) : null;
        selectedRail = sec ? { type: 'section', sec } : null;
        if (selected) showInfo(selected);
        else if (selectedRail) showRailInfo(selectedRail);
        else showInfo(null);
      }
      needsDraw = true;
    }
    drag = null;
    canvas.classList.remove('dragging');
  });
  // 凡例の高さを測り、上の読み込みパネルがその上までに収まるようにする
  const setLegendHeight = () => {
    document.documentElement.style.setProperty('--legend-h', $('legend').offsetHeight + 'px');
  };
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(setLegendHeight).observe($('legend'));
  setLegendHeight();
  canvas.addEventListener('pointerleave', () => { $('coord').textContent = ''; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const [wx, wz] = toWorld(e.clientX, e.clientY);
    view.scale = clamp(view.scale * Math.exp(-e.deltaY * 0.0015), MIN_SCALE, MAX_SCALE);
    const [nx, nz] = toWorld(e.clientX, e.clientY);
    view.cx += wx - nx;
    view.cz += wz - nz;
    needsDraw = true;
  }, { passive: false });
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { selected = null; showInfo(null); needsDraw = true; }
  });
  // OS の明るさを切り替えたら、地図の色も合わせる
  const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener('change', () => { readTheme(); needsDraw = true; });

  readTheme();
  resize();
  buildLanesLegend();
  $('tunnelSwatch').style.background = mixHex(ROAD_STYLE.general.fill, GRAY_HEX, TUNNEL_TINT);
  function frame() {
    if (needsDraw) { draw(); needsDraw = false; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  loadDefaultTiles();
  autoLoadData();
  // テストやデバッグ用に、読み込み関数を公開する
  window.roadMap = {
    loadText, loadTileFiles, pick, view, autoLoadData, loadDataFolder,
    get roads() { return roads; },
    get tiles() {
      return [...tiles.values()].map((t) => ({
        n: t.n, level: t.level, loading: t.loading, failed: t.failed, hasBitmap: !!t.bitmap,
      }));
    },
  };
})();
</script>
</body>
</html>
